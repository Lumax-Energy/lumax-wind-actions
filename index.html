<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind actions — SANS 10160-3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap');

:root{
  --ink:#16212b; --muted:#5d6f80; --faint:#8496a6;
  --paper:#e5eaef; --card:#fff; --rule:#ccd6e0; --rule-2:#e3e9ee;
  --navy:#0e3763; --amber:#e8871c; --maroon:#7d2110;
  --pos:#0d2f55; --neg:#cc5a17;
  --sans:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Barlow',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); font-size:15px; line-height:1.45;
  color:var(--ink); background:var(--paper);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--cond); font-weight:600; letter-spacing:.01em; margin:0}

/* ---------- frame ---------- */
header{
  background:var(--ink); color:#e9eef3; padding:10px 20px;
  display:flex; align-items:baseline; gap:20px; flex-wrap:wrap;
  border-bottom:3px solid var(--navy);
}
header h1{font-size:23px; color:#fff; line-height:1.1}
header .code{font-size:14px; color:#9db1c4; font-family:var(--cond); letter-spacing:.02em}
header .live{margin-left:auto; display:flex; gap:22px; align-items:baseline}
header .live b{font-size:21px; font-family:var(--cond); font-weight:600; color:#ffd79a}
header .live span{font-size:13px; color:#9db1c4}
.btn{
  font:500 15px var(--cond); letter-spacing:.02em; cursor:pointer;
  background:#2c4a6b; color:#fff; border:1px solid #40658c; border-radius:3px; padding:5px 13px;
}
.btn:hover{background:#37587d}

nav{display:flex; gap:1px; background:var(--rule); border-bottom:1px solid var(--rule); overflow-x:auto}
nav button{
  font:500 16px/1 var(--cond); letter-spacing:.02em; white-space:nowrap;
  background:#f4f7f9; color:var(--muted); border:0; padding:11px 17px; cursor:pointer;
}
nav button:hover{background:#fff; color:var(--ink)}
nav button[aria-selected=true]{background:var(--card); color:var(--navy); box-shadow:inset 0 -3px 0 var(--amber)}

main{display:grid; grid-template-columns:335px 1fr; gap:1px; background:var(--rule); min-height:calc(100vh - 108px)}
aside{background:#f4f7f9; padding:16px 18px 40px; overflow-y:auto}
section.results{background:var(--card); padding:20px 24px 50px; min-width:0}

/* ---------- inputs ---------- */
.group{margin-bottom:22px}
.group > h3{
  font-size:16px; color:var(--navy); border-bottom:1px solid var(--rule);
  padding-bottom:4px; margin-bottom:10px;
}
.f{display:grid; grid-template-columns:1fr 96px; gap:6px 8px; align-items:center; margin-bottom:7px}
.f label{font-size:13.5px; color:var(--muted); line-height:1.25}
.f label i{font-style:normal; color:var(--faint)}
.f input,.f select{
  font:500 14px var(--sans); font-variant-numeric:tabular-nums;
  width:100%; padding:5px 7px; border:1px solid var(--rule); border-radius:2px;
  background:#fff; color:var(--ink);
}
.f.wide{grid-template-columns:1fr}
.f.wide select,.f.wide input{width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--amber); outline-offset:-1px; border-color:var(--amber)}
.f .unit{font-size:12px; color:var(--faint); grid-column:2; margin-top:-4px}
.hint{font-size:12.5px; color:var(--faint); line-height:1.35; margin:-2px 0 10px}
.pick{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-bottom:10px}
.pick button{
  background:#fff; border:1px solid var(--rule); border-radius:3px; cursor:pointer;
  padding:4px; display:flex; flex-direction:column; align-items:center; gap:2px;
  font:500 13px var(--cond); color:var(--muted); letter-spacing:.02em;
}
.pick button svg{width:100%; height:52px}
.pick button[aria-pressed=true]{border-color:var(--navy); background:#eaf1f8; color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy)}

/* ---------- results ---------- */
.results h2{font-size:24px; margin-bottom:2px}
.results h3{font-size:18px; color:var(--navy); margin:26px 0 8px}
.lede{color:var(--muted); font-size:14px; margin:0 0 18px; max-width:70ch}

.figs{display:flex; flex-wrap:wrap; gap:18px; margin:6px 0 4px}
.fig{flex:1 1 380px; min-width:300px; border:1px solid var(--rule-2); border-radius:4px; background:#fbfcfd; padding:8px 10px 10px}
.fig h4{font:600 15px var(--cond); letter-spacing:.02em; margin:0 0 2px; color:var(--ink)}
.fig .cap{font-size:12.5px; color:var(--faint); margin-bottom:4px}
.fig .body{display:flex; gap:8px; align-items:flex-start}
.fig svg.iso{flex:1 1 auto; max-width:100%; height:auto}
.legend{flex:0 0 auto; display:flex; flex-direction:column; gap:2px; padding-top:4px}
.legend div{display:flex; align-items:center; gap:6px; font-size:12.5px; white-space:nowrap}
.legend i{width:13px; height:13px; border:1px solid rgba(0,0,0,.28); display:block; flex:none}
.legend b{font-weight:600; font-family:var(--cond); font-size:14px; letter-spacing:.02em}

table{border-collapse:collapse; width:100%; font-size:13.5px; margin:4px 0 6px}
th,td{padding:4px 8px; text-align:right; border-bottom:1px solid var(--rule-2)}
th:first-child,td:first-child{text-align:left}
thead th{
  font:600 13px var(--cond); letter-spacing:.03em; color:var(--muted);
  border-bottom:1px solid var(--rule); text-align:right;
}
thead th:first-child{text-align:left}
tbody tr:hover{background:#f6f9fb}
td.z{font-weight:600; font-family:var(--cond); font-size:15px}
td.neg{color:var(--maroon)} td.pos{color:var(--navy)}
.sw{display:inline-block; width:11px; height:11px; border:1px solid rgba(0,0,0,.25); margin-right:6px; vertical-align:-1px}

.trail{border-left:3px solid var(--rule); padding-left:14px; margin:6px 0 14px; max-width:62ch}
.trail div{display:grid; grid-template-columns:1fr auto; gap:10px; padding:3px 0; border-bottom:1px dotted var(--rule-2)}
.trail span{color:var(--muted); font-size:13.5px}
.trail span em{font-style:normal; color:var(--faint); font-size:12.5px; margin-left:6px}
.trail b{font-family:var(--cond); font-size:17px; font-weight:600}
.trail div.key b{color:var(--navy)}

.cards{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 6px}
.card{
  flex:1 1 150px; border:1px solid var(--rule-2); border-top:3px solid var(--navy);
  border-radius:3px; padding:8px 12px 10px; background:#fbfcfd;
}
.card b{display:block; font:600 26px/1.1 var(--cond); color:var(--navy)}
.card span{font-size:12.5px; color:var(--muted)}

.note{
  font-size:13px; color:var(--muted); background:#f6f9fb; border-left:3px solid var(--amber);
  padding:8px 12px; margin:12px 0; max-width:80ch;
}
.note b{color:var(--ink)}
.warn{border-left-color:var(--maroon); background:#fdf4f1}
.ok{color:#1f6b3a}

.chart{width:100%; max-width:560px; height:auto; display:block}
.ref{font-size:12.5px; color:var(--faint)}

@media (max-width:860px){
  main{grid-template-columns:1fr}
  aside{max-height:none}
  header .live{width:100%; margin-left:0}
}

/* ---------- print ---------- */
.reportOnly{display:none}
@media print{
  nav,aside,.btn{display:none !important}
  body{background:#fff; font-size:11pt}
  main{display:block}
  section.results{padding:0}
  header{background:#fff; color:#000; border-bottom:2px solid #000}
  header h1{color:#000} header .code,header .live span{color:#333}
  header .live b{color:#000}
  .fig{break-inside:avoid} table{break-inside:avoid}
  .results h3{break-after:avoid}
}

/* ---------- view toggle ---------- */
.vtoggle{display:flex; align-items:center; gap:6px; margin:14px 0 4px}
.vtoggle button{
  font:500 14px var(--cond); letter-spacing:.02em; cursor:pointer;
  background:#fff; color:var(--muted); border:1px solid var(--rule); padding:4px 12px;
}
.vtoggle button:first-of-type{border-radius:3px 0 0 3px}
.vtoggle button:nth-of-type(2){border-radius:0 3px 3px 0; border-left:0}
.vtoggle button[aria-pressed=true]{background:var(--navy); border-color:var(--navy); color:#fff}
.vtoggle span{font-size:12.5px; color:var(--faint); margin-left:8px}
@media print{ .vtoggle button{display:none} .vtoggle span{margin-left:0} }

/* ---------- report download bar ---------- */
.docbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0 6px}
.docbar span{font-size:12.5px; color:var(--faint)}
.btn.big{font-size:16px; padding:8px 18px; background:var(--navy); border-color:var(--navy)}
.btn.big:hover{background:#17497e}
.btn.ghost{background:#fff; color:var(--muted); border-color:var(--rule)}
.btn.ghost:hover{background:#f4f7f9; color:var(--ink)}
@media print{ .docbar{display:none} }
svg.key{width:100%; max-width:440px; height:auto; display:block}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--ink); color:#fff; font:500 14px var(--sans);
  padding:9px 18px; border-radius:4px; box-shadow:0 4px 18px rgba(20,33,45,.28);
  z-index:99; opacity:1; transition:opacity .5s; max-width:80vw;
}
.toast.bad{background:var(--maroon)}
@media print{ .toast{display:none} }

</style>
</head>

/* ---------- generic helpers ---------- */

function lerp(a, b, t) { return a + (b - a) * t; }

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

/** Piecewise-linear lookup in a table whose first column is the argument. */
function tableLookup(rows, x, col) {
  const n = rows.length;
  if (x <= rows[0][0]) return rows[0][col];
  if (x >= rows[n - 1][0]) return rows[n - 1][col];
  for (let i = 1; i < n; i++) {
    if (x <= rows[i][0]) {
      const x0 = rows[i - 1][0], x1 = rows[i][0];
      const v0 = rows[i - 1][col], v1 = rows[i][col];
      if (v0 === null || v1 === null) return v0 === null ? v1 : v0;
      return x1 === x0 ? v1 : lerp(v0, v1, (x - x0) / (x1 - x0));
    }
  }
  return rows[n - 1][col];
}

/** Interpolate in a list of (x, y) pairs held as parallel arrays. */
function interpArrays(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  for (let i = 1; i < xs.length; i++) {
    if (x <= xs[i]) return lerp(ys[i - 1], ys[i], (x - xs[i - 1]) / (xs[i] - xs[i - 1]));
  }
  return ys[ys.length - 1];
}

/** Cpe for a loaded area A between Cpe,1 and Cpe,10 — Figure 5. */
function cpeForArea(cpe10, cpe1, A) {
  if (cpe10 === null || cpe1 === null) return cpe10 === null ? cpe1 : cpe10;
  if (!(A > 0)) return cpe1;
  if (A <= 1) return cpe1;
  if (A >= 10) return cpe10;
  return cpe1 + (cpe10 - cpe1) * Math.log10(A);
}

/* ---------- 7.2 / 7.3 / 7.4  peak wind speed pressure ---------- */

/** Probability factor, cl 7.2.3 eq 2. K = 0.2, n = 0.5. */
function cProb(returnPeriod) {
  const K = 0.2, n = 0.5;
  const p = 1 / Math.max(returnPeriod, 1.0001);
  const num = 1 - K * Math.log(-Math.log(1 - p));
  const den = 1 - K * Math.log(-Math.log(0.98));
  return Math.pow(num / den, n);
}

/** Air density from site altitude — Table 4. */
function airDensity(altitude) {
  const xs = AIR_DENSITY.map(r => r[0]), ys = AIR_DENSITY.map(r => r[1]);
  return interpArrays(xs, ys, clamp(altitude, 0, 2000));
}

/** Terrain roughness factor, cl 7.3.2.1 eq 5:  cr(z) = 1,36 ((z - z0)/(zg - z0))^a, z >= zc */
function cRough(z, cat) {
  const t = TERRAIN[cat];
  const zEff = Math.max(z, t.zc);
  return 1.36 * Math.pow(Math.max(zEff - t.z0, 1e-6) / (t.zg - t.z0), t.a);
}

/**
 * Full site calculation.
 * @returns {{cprob, vb, vbPeak, rho, at:(z)=>({cr,vp,qp})}}
 */
function sitePressure(o) {
  const cprob = o.useCprob === false ? 1 : cProb(o.returnPeriod);
  const vb = o.vb0 * cprob;
  const vbPeak = vb; // 3 s gust map, cl 7.3.1.1 eq 4 ratio = 1.0
  const rho = airDensity(o.altitude);
  const at = z => {
    const cr = cRough(z, o.terrain);
    const vp = cr * o.c0 * vbPeak;
    return { z, cr, vp, qp: 0.5 * rho * vp * vp / 1000 };
  };
  return { cprob, vb, vbPeak, rho, at };
}

/**
 * Reference heights over the structure height — cl 8.3.2.1, Figure 7.
 * Returns strips from the ground up: {zBot, zTop, ze}
 */
function referenceHeights(h, b, hStrip) {
  if (h <= b) return [{ zBot: 0, zTop: h, ze: h }];
  if (h <= 2 * b) return [{ zBot: 0, zTop: b, ze: b }, { zBot: b, zTop: h, ze: h }];
  const parts = [{ zBot: 0, zTop: b, ze: b }];
  const hs = Math.max(hStrip || 1, 0.1);
  let z = b;
  const zTopStart = h - b;
  while (z < zTopStart - 1e-9) {
    const zt = Math.min(z + hs, zTopStart);
    parts.push({ zBot: z, zTop: zt, ze: zt });
    z = zt;
  }
  parts.push({ zBot: z, zTop: h, ze: h });
  return parts;
}

/* ---------- 8.3.2  vertical walls of rectangular buildings ---------- */

/**
 * Wall zones and coefficients for one wind direction.
 * b = crosswind width, d = alongwind depth, h = height, A = loaded area.
 */
function wallZones(h, b, d, A) {
  const e = Math.min(b, 2 * h);
  const hd = h / d;
  const zones = [];
  if (e < d) {
    zones.push({ id: 'A', x0: 0, x1: e / 5 });
    zones.push({ id: 'B', x0: e / 5, x1: e });
    zones.push({ id: 'C', x0: e, x1: d });
  } else if (e < 5 * d) {
    zones.push({ id: 'A', x0: 0, x1: e / 5 });
    zones.push({ id: 'B', x0: e / 5, x1: d });
  } else {
    zones.push({ id: 'A', x0: 0, x1: d });
  }
  const col = { A: 1, B: 3, C: 5, D: 7, E: 9 };
  const cpe = {};
  ['A', 'B', 'C', 'D', 'E'].forEach(id => {
    const c10 = tableLookup(TBL.T6, hd, col[id]);
    const c1 = tableLookup(TBL.T6, hd, col[id] + 1);
    cpe[id] = { cpe10: c10, cpe1: c1, cpe: cpeForArea(c10, c1, A) };
  });
  // cl 8.3.2.4 lack of correlation between windward and leeward faces
  let corr = 1.0;
  if (hd <= 1) corr = 0.85;
  else if (hd < 5) corr = lerp(0.85, 1.0, (hd - 1) / 4);
  return { e, hd, zones, cpe, corr };
}

/* ---------- 8.3.3  flat roofs ---------- */

function flatRoofZones(h, b, d) {
  const e = Math.min(b, 2 * h);
  return {
    e,
    F: { widthEach: e / 4, depth: e / 10 },
    G: { width: Math.max(b - e / 2, 0), depth: e / 10 },
    H: { depth: Math.max(e / 2 - e / 10, 0) },
    I: { depth: Math.max(d - e / 2, 0) }

function flatRoofCpe(edge, A) {
  // edge: {type:'sharp'|'parapet'|'curved'|'mansard', hp_h, r_h, alpha}
  let rows = TBL.T7_hp, x = 0;

  else if (edge.type === 'mansard') { rows = TBL.T7_a; x = edge.alpha; }
  const pick = (c10, c1) => ({ cpe10: tableLookup(rows, x, c10), cpe1: tableLookup(rows, x, c1) });
  const out = {};
  [['F', 1, 2], ['G', 3, 4], ['H', 5, 6]].forEach(([id, a, b2]) => {
    const p = pick(a, b2);
    out[id] = { ...p, cpe: cpeForArea(p.cpe10, p.cpe1, A) };
  });

    cpe10: ineg.cpe10, cpe1: ineg.cpe1,
    cpe: cpeForArea(ineg.cpe10, ineg.cpe1, A),
    cpePos: cpeForArea(ipos.cpe10, ipos.cpe1, A)

}

  const g = (t, c10, c1) => {
    const a = tableLookup(t, alpha, c10), b = tableLookup(t, alpha, c1);
    return { cpe10: a, cpe1: b, cpe: cpeForArea(a, b, A) };
  };
  return {
    deg0neg: { F: g(TBL.T10, 1, 2), G: g(TBL.T10, 3, 4), H: g(TBL.T10, 5, 6), I: g(TBL.T10, 7, 8), J: g(TBL.T10, 9, 10) },
    deg0pos: { F: g(TBL.T10, 11, 12), G: g(TBL.T10, 13, 14), H: g(TBL.T10, 15, 16), I: g(TBL.T10, 17, 18), J: g(TBL.T10, 19, 20) },
    deg90: { F: g(TBL.T11, 1, 2), G: g(TBL.T11, 3, 4), H: g(TBL.T11, 5, 6), I: g(TBL.T11, 7, 8) }
  };
}

/* ---------- 8.3.6  hipped roofs ---------- */

function hipCpe(alpha0, alpha90, A) {
  const g = (al, c10, c1) => {
    const a = tableLookup(TBL.T12, al, c10), b = tableLookup(TBL.T12, al, c1);
    return { cpe10: a, cpe1: b, cpe: cpeForArea(a, b, A) };
  };
  const ids = ['F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N'];
  const case1 = (al) => {
    const o = {};
    ids.forEach((id, i) => { o[id] = g(al, 1 + 2 * i, 2 + 2 * i); });
    return o;
  };
  const case2 = (al) => ({ F: g(al, 19, 20), G: g(al, 21, 22), H: g(al, 23, 24) });
  return { deg0: case1(alpha0), deg0pos: case2(alpha0), deg90: case1(alpha90) };
}

function hipZones(h, b, d) {
  const e = Math.min(b, 2 * h);
  return {
    e,
    d0: {
      F: { widthEach: e / 4, depth: e / 10 }, G: { width: Math.max(b - e / 2, 0), depth: e / 10 },
      H: { depth: Math.max(d / 2 - e / 10, 0) }, I: { depth: Math.max(d / 2 - e / 10, 0) },
      J: { width: e / 10 }, K: { depth: e / 10 }, L: { depth: e / 10 }, M: { depth: Math.max(d - e / 10, 0) }
    },
    d90: {
      F: { widthEach: e / 4, depth: e / 10 }, G: { width: Math.max(b - e / 2, 0), depth: e / 10 },
      H: { depth: Math.max(e / 2 - e / 10, 0) }, I: { depth: Math.max(d - e / 2, 0) },
      J: { width: e / 10 }, L: { depth: e / 10 }, M: { depth: Math.max(e / 2 - e / 10, 0) }, N: { depth: Math.max(d - e / 2, 0) }
    }
  };
}

/* ---------- 8.3.9  internal pressure ---------- */

function cpiFromMu(mu, hd) {
  const up = interpArrays(FIG16.mu, FIG16.upper, clamp(mu, 0, 1));
  const lo = interpArrays(FIG16.mu, FIG16.lower, clamp(mu, 0, 1));
  if (hd <= 0.25) return { cpi: up, upper: up, lower: lo };
  if (hd >= 1) return { cpi: lo, upper: up, lower: lo };
  return { cpi: lerp(up, lo, (hd - 0.25) / 0.75), upper: up, lower: lo };
}

/**
 * @param faces array of 4 {area, openArea, cpe:[cpe for wind 0,90,180,270]}
 * @param hd h/d for each of the four wind directions
 */
function internalPressure(faces, hdByDir) {
  const dirs = [0, 90, 180, 270];
  const totalOpen = faces.reduce((s, f) => s + f.openArea, 0);
  return dirs.map((dir, di) => {
    // dominant face test, cl 8.3.9.4
    let dominant = -1, ratio = 0;
    faces.forEach((f, i) => {
      const others = totalOpen - f.openArea;
      const r = others > 0 ? f.openArea / others : (f.openArea > 0 ? Infinity : 0);
      if (r >= 2 && r > ratio) { ratio = r; dominant = i; }
    });
    if (dominant >= 0) {
      const cpeD = faces[dominant].cpe[di];
      const factor = ratio >= 3 ? 0.90 : 0.75;
      return { dir, mode: 'dominant', face: dominant + 1, ratio, factor, cpi: factor * cpeD };
    }
    if (totalOpen <= 0) return { dir, mode: 'none', cpi: null };
    const negArea = faces.reduce((s, f) => s + (f.cpe[di] <= 0 ? f.openArea : 0), 0);
    const mu = negArea / totalOpen;
    const r = cpiFromMu(mu, hdByDir[di]);
    return { dir, mode: 'mu', mu, ...r };
  });
}

/* ---------- 8.4  canopy roofs ---------- */

function canopyMono(alpha, phi, A) {
  const L = (c) => tableLookup(TBL.T13, alpha, c);
  const mn = (c0, c1) => lerp(L(c0), L(c1), clamp(phi, 0, 1));
  return {
    cf: { max: L(1), min: mn(5, 9) },
    zones: {
      A: { max: L(2), min: mn(6, 10) },
      B: { max: L(3), min: mn(7, 11) },
      C: { max: L(4), min: mn(8, 12) }
    }
  };
}

function canopyDuo(alpha, phi) {
  const L = (c) => tableLookup(TBL.T14, alpha, c);
  const mn = (c0, c1) => lerp(L(c0), L(c1), clamp(phi, 0, 1));
  return {
    cf: { max: L(1), min: mn(6, 11) },
    zones: {
      A: { max: L(2), min: mn(7, 12) },
      B: { max: L(3), min: mn(8, 13) },
      C: { max: L(4), min: mn(9, 14) },
      D: { max: L(5), min: mn(10, 15) }
    }
  };
}

/* ---------- 8.5  free-standing walls, parapets, signboards ---------- */

const T16 = {
  // solidity 1.0, no return corners: L/h -> [A,B,C,D]
  solid: [[3, 2.3, 1.4, 1.2, 1.2], [5, 2.9, 1.8, 1.4, 1.2], [10, 3.4, 2.1, 1.7, 1.2]],
  withCorners: [2.1, 1.8, 1.4, 1.2], // return corner length >= h
  porous: [1.2, 1.2, 1.2, 1.2]       // solidity 0.8
};

function freeWall(h, L, Lc, phi) {
  const Lh = L / h;
  const noCorner = [1, 2, 3, 4].map(c => tableLookup(T16.solid, Lh, c));
  const t = clamp(Lc / h, 0, 1);
  const solid = noCorner.map((v, i) => lerp(v, T16.withCorners[i], t));
  const ph = clamp(phi, 0.8, 1);
  const cp = solid.map((v, i) => lerp(T16.porous[i], v, (ph - 0.8) / 0.2));
  const zones = [];
  if (Lh <= 2) {
    zones.push({ id: 'A', x0: 0, x1: 0.3 * h }, { id: 'B', x0: 0.3 * h, x1: 2 * h });
    if (L > 2 * h) zones.push({ id: 'C', x0: 2 * h, x1: L });
  } else {
    zones.push({ id: 'A', x0: 0, x1: 0.3 * h }, { id: 'B', x0: 0.3 * h, x1: 2 * h }, { id: 'C', x0: 2 * h, x1: Math.min(4 * h, L) });
    if (L > 4 * h) zones.push({ id: 'D', x0: 4 * h, x1: L });
  }
  return { Lh, zones, cpNet: { A: cp[0], B: cp[1], C: cp[2], D: cp[3] }, noCorner, solid };
}

function signboard(hSign, b, hg) {
  const zg = hg;
  const applies = zg >= hSign / 4;
  const ze = hg + hSign / 2;
  const Aref = hSign * b;
  const cf = 1.8;
  return { applies, ze, Aref, cf, ecc: b / 4 };
}

/* ---------- 7.5.3.6 / 8.6  friction ---------- */

function frictionForce(h, b, d, cfr, qp) {
  const start = Math.min(2 * b, 4 * h);         // no friction within this distance of the windward edge
  const roofLen = Math.max(d - start, 0);
  const Aroof = roofLen * b;
  const Awalls = 2 * roofLen * h;
  const Afr = Aroof + Awalls;
  const wfr = cfr * qp;
  const areaPar = 2 * d * h + b * d;            // side walls + roof
  const areaPerp = 2 * b * h;                   // windward + leeward walls
  return {
    start, Afr, Aroof, Awalls, wfr, Ffr: wfr * Afr,
    areaPar, areaPerp, ratio: areaPerp > 0 ? areaPar / areaPerp : Infinity,
    ignorable: areaPar <= 4 * areaPerp
  };
}

/* ---------- Annex B.3  topography ---------- */

function topographyFactor(o) {
  // o: {shape:'cliff'|'hill', H, Lu, Ld, x, z}   x < 0 upwind of the crest
  const { H, Lu, Ld, x, z } = o;
  const phi = H / Lu;
  const Le = phi > 0.3 ? H / 0.3 : Lu;
  const phiEff = Math.min(phi, 0.3);
  const zLe = z / Le;
  const done = (s, note) => ({ phi, phiEff, Le, zLe, s, c0: 1 + 2 * s * phiEff, note: note || '' });

  if (phi < 0.05) return done(0, 'Upwind slope flatter than 1:20 — topography may be ignored (cl B.3.2).');
  if (zLe > 2) return done(0, 'z/Le > 2 — the site is above the zone of influence.');

  // A and B are functions of z/Le; the exponential decays along the wind
  const r = zLe;
  const A1 = 0.1552 * r ** 4 - 0.8575 * r ** 3 + 1.8133 * r ** 2 - 1.9115 * r + 1.0124;

  if (x < 0) { // upwind section, all shapes
    const xr = x / Lu;
    if (xr < -1.5) return done(0, 'More than 1.5 Lu upwind of the crest.');
    const B = 0.3542 * r ** 2 - 1.0577 * r + 2.6456;
    return done(clamp(A1 * Math.exp(B * xr), 0, 1.2));
  }
  if (o.shape === 'hill') { // downwind of a hill or ridge
    const xr = x / Ld;
    if (xr > 2) return done(0, 'More than 2 Ld downwind of the crest.');
    const B = -0.3056 * r ** 2 + 1.0212 * r - 1.7637;
    return done(clamp(A1 * Math.exp(B * xr), 0, 1.2));
  }
  // downwind of a cliff or escarpment
  const xr = x / Le;
  if (xr > 3.5) return done(0, 'More than 3.5 Le downwind of the crest.');
  const lx = Math.log10(clamp(xr, 0.1, 3.5));
  const lz = Math.log10(clamp(zLe, 0.1, 2));
  const A = -1.3420 * lz ** 3 - 0.8222 * lz ** 2 + 0.4609 * lz - 0.0791;
  const B = -1.0196 * lz ** 3 - 0.8910 * lz ** 2 + 0.5343 * lz - 0.1156;
  const C = 0.8030 * lz ** 3 + 0.4236 * lz ** 2 - 0.5738 * lz + 0.1606;
  return done(clamp(A * lx * lx + B * lx + C, 0, 1.2));
}

/* ============================================================
   Illustration engine
   A scene is a list of planar SURFACES. Each surface carries a
   polygon, an outward normal and a set of ZONES that tile it.
   The bodies drawn are convex, so back-face culling alone gives
   correct occlusion — no translucency, no floating blocks.
   ============================================================ */

const VIEW = { az: 36 * Math.PI / 180, el: -24 * Math.PI / 180 };

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
function maxDepth(pts, F) {
  let m = -Infinity;
  for (const p of pts) { const d = dot(p, F); if (d > m) m = d; }
  return m;
}
function centroid(pts) { return mul(pts.reduce((a, p) => add(a, p), [0, 0, 0]), 1 / pts.length); }

const LIGHT = norm([-0.42, -0.5, 0.76]);

/* ---------- colour ---------- */

function mixHex(c1, c2, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return '#' + a.map((x, i) => Math.round(x + (b[i] - x) * t).toString(16).padStart(2, '0')).join('');
}
function tint(hex, f) {
  return '#' + [1, 3, 5].map(i => {
    const c = parseInt(hex.slice(i, i + 2), 16) * f;
    return Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0');
  }).join('');
}
function planarArea(poly) {
  let s = [0, 0, 0];
  for (let i = 0; i < poly.length; i++) s = add(s, cross(poly[i], poly[(i + 1) % poly.length]));
  return Math.hypot(s[0], s[1], s[2]) / 2;
}
function perimeter(poly) {
  let s = 0;
  for (let i = 0; i < poly.length; i++) {
    const d = sub(poly[(i + 1) % poly.length], poly[i]);
    s += Math.hypot(d[0], d[1], d[2]);
  }
  return s;
}
/**
 * Pull a zone back from the edges of the surface it sits on, working in the
 * surface's own plane. Boundaries between zones on the same surface are left
 * alone; only the outer edges move. This is what stops a block on one face
 * from running into a block on the face next to it.
 */
function insetFromSurfaceEdge(zonePoly, surfPoly, n, m) {
  if (!(m > 1e-9)) return zonePoly;
  const o = zonePoly[0];
  let u = sub(zonePoly[1], o);
  if (Math.hypot(u[0], u[1], u[2]) < 1e-9) return zonePoly;
  u = norm(u);
  const v = cross(n, u);
  const to2 = p => [dot(sub(p, o), u), dot(sub(p, o), v)];
  const to3 = p => add(add(o, mul(u, p[0])), mul(v, p[1]));
  const Z = zonePoly.map(to2), Sf = surfPoly.map(to2);
  const c = [Sf.reduce((a, p) => a + p[0], 0) / Sf.length, Sf.reduce((a, p) => a + p[1], 0) / Sf.length];
  let poly = Z;
  for (let i = 0; i < Sf.length; i++) {
    const a = Sf[i], b = Sf[(i + 1) % Sf.length];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (L < 1e-9) continue;
    let A = -(b[1] - a[1]) / L, B = (b[0] - a[0]) / L;
    let C = -(A * a[0] + B * a[1]);
    if (A * c[0] + B * c[1] + C < 0) { A = -A; B = -B; C = -C; }
    poly = clipHalf(poly, A, B, C - m);
    if (poly.length < 3) return null;
  }
  return poly.map(to3);
}
function pointInPoly(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function luminance(hex) {
  const p = i => parseInt(hex.slice(i, i + 2), 16) / 255;
  return 0.2126 * p(1) + 0.7152 * p(3) + 0.0722 * p(5);
}

const RAMP_SUCTION = ['#fdf7e6', '#fbe8b4', '#f8d383', '#f3b459', '#ea8f3e', '#dc6a30', '#b93f22'];
const RAMP_PRESSURE = ['#e4eff8', '#bcd7ec', '#82b2da', '#4d88bd', '#2b6196'];

function rampColour(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const n = stops.length - 1, i = Math.min(Math.floor(t * n), n - 1);
  return mixHex(stops[i], stops[i + 1], t * n - i);
}
// Coefficients bunch up at the low end, so the ramp is eased to pull those
// values apart instead of leaving half the zones in the same pale yellow.
const EASE = t => Math.pow(Math.max(0, Math.min(1, t)), 0.80);
function pressureColour(v, maxNeg, maxPos) {
  if (v === null || v === undefined || !isFinite(v)) return '#cfd8e0';
  if (v < 0) return rampColour(RAMP_SUCTION, EASE(maxNeg > 0 ? Math.abs(v) / maxNeg : 0));
  if (v > 0) return rampColour(RAMP_PRESSURE, EASE(maxPos > 0 ? v / maxPos : 0));
  return '#e6ebef';
}

/* ---------- 2D polygon clipping (Sutherland–Hodgman) ---------- */

/** Keep the part of poly where a·x + b·y + c >= 0. */
function clipHalf(poly, a, b, c) {
  if (!poly || poly.length < 3) return [];
  const f = p => a * p[0] + b * p[1] + c;
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    const fp = f(P), fq = f(Q);
    if (fp >= -1e-9) out.push(P);
    if ((fp > 1e-9 && fq < -1e-9) || (fp < -1e-9 && fq > 1e-9)) {
      const t = fp / (fp - fq);
      out.push([P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]);
    }
  }
  return out.length >= 3 ? out : [];
}
/** Band lo <= axis <= hi.  axis 0 = x, 1 = y. */
function clipBand(poly, axis, lo, hi) {
  let p = poly;
  if (lo !== null && isFinite(lo)) p = clipHalf(p, axis === 0 ? 1 : 0, axis === 0 ? 0 : 1, -lo);
  if (hi !== null && isFinite(hi)) p = clipHalf(p, axis === 0 ? -1 : 0, axis === 0 ? 0 : -1, hi);
  return p;
}
/** Keep the side of line p1→p2 containing `inside`, with the cut moved `off` toward `inside`. */
function clipLine(poly, p1, p2, inside, off) {
  let a = -(p2[1] - p1[1]), b = p2[0] - p1[0];
  const l = Math.hypot(a, b) || 1; a /= l; b /= l;
  let c = -(a * p1[0] + b * p1[1]);
  if (a * inside[0] + b * inside[1] + c < 0) { a = -a; b = -b; c = -c; }
  return clipHalf(poly, a, b, c - (off || 0));
}
function polyArea(p) {
  if (!p || p.length < 3) return 0;
  let s = 0;
  for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; s += p[i][0] * q[1] - q[0] * p[i][1]; }
  return Math.abs(s) / 2;
}
const lift = (poly, zf) => poly.map(p => [p[0], p[1], zf(p[0], p[1])]);

/* ---------- surfaces ---------- */

function surface(poly3, n, opts = {}) {
  return { poly: poly3, n: norm(n), zones: [], ...opts };
}
function addZone(surf, id, plan, zf, v) {
  if (!plan || plan.length < 3 || v === undefined || v === null || !isFinite(v)) return;
  if (polyArea(plan) < 1e-7) return;
  surf.zones.push({ id, poly: lift(plan, zf), v });
}
/** Vertical surface built from a 2D outline in (s, z); `map` turns s into x,y. */
function vertSurface(outline, map, n) {
  return surface(outline.map(p => map(p[0], p[1])), n);
}
function addVertZone(surf, id, outline2d, map, v) {
  if (!outline2d || outline2d.length < 3 || v === undefined || v === null || !isFinite(v)) return;
  if (polyArea(outline2d) < 1e-7) return;
  surf.zones.push({ id, poly: outline2d.map(p => map(p[0], p[1])), v });
}

/* ---------- renderer ---------- */

function renderScene(scene, o = {}) {
  const W = o.width || 430, H = o.height || 290;
  const sa = Math.sin(VIEW.az), ca = Math.cos(VIEW.az), se = Math.sin(VIEW.el), ce = Math.cos(VIEW.el);
  const R = [-sa, ca, 0], U = [-se * ca, -se * sa, ce], F = [ce * ca, ce * sa, se];

  const surfaces = (scene.surfaces || []).filter(s => s.poly.length >= 3);
  const vals = [];
  surfaces.forEach(s => s.zones.forEach(z => { if (isFinite(z.v)) vals.push(z.v); }));
  const maxNeg = o.scale ? o.scale.neg : Math.max(0, ...vals.map(v => -v), 0);
  const maxPos = o.scale ? o.scale.pos : Math.max(0, ...vals.map(v => v), 0);

  const allPts = surfaces.flatMap(s => s.poly);
  if (!allPts.length) return { svg: `<svg viewBox="0 0 ${W} ${H}"></svg>`, maxNeg, maxPos, zones: [] };
  const ext = i => [Math.min(...allPts.map(p => p[i])), Math.max(...allPts.map(p => p[i]))];
  const [x0, x1] = ext(0), [y0, y1] = ext(1), [z0, z1] = ext(2);
  const span = Math.max(x1 - x0, y1 - y0, z1 - z0, 1e-6);
  // Blocks are sized off the elevation, not the plan, so a long low building
  // does not end up with towers standing on its roof.
  const blockRef = Math.min(0.38 * Math.max(z1 - z0, 1e-6), 0.10 * span);

  const visible = surfaces.filter(s => dot(s.n, F) < -0.008);
  visible.sort((a, b) => ((a.order || 0) - (b.order || 0)) || (maxDepth(b.poly, F) - maxDepth(a.poly, F)));

  const items = [];
  const push = (poly, fill, stroke, sw, extra) => items.push({ poly, fill, stroke, sw, ...extra });
  const blocks = o.mode === 'blocks';
  const peak = Math.max(maxNeg, maxPos, 1e-9);

  // Surfaces are drawn far to near. Each surface is finished — body, outline,
  // then its own pressure blocks — before moving to the next one, so blocks
  // never jump in front of a surface that is nearer the eye.
  visible.forEach((s, si) => {
    const shade = 0.72 + 0.34 * Math.max(0, dot(s.n, LIGHT));
    if (!s.zones.length) {
      push(s.poly, tint(s.body || '#aab6c2', shade), null, 0);
    } else {
      s.zones.forEach((z, zi) => {
        const base = pressureColour(z.v, maxNeg, maxPos);
        push(z.poly, tint(base, shade), 'rgba(255,255,255,.55)', 0.9,
          { label: z.id, gid: si + '.' + zi, base: tint(base, shade), tag: z.id + ':face' });
      });
    }
    push(s.poly, null, null, 0, { outline: true });
    if (!blocks || !s.zones.length) return;

    const faces = [];
    s.zones.forEach((z, zi) => {
      // A block standing on one face sticks out into the space in front of the
      // faces next to it, so the footprint is pulled back from the edges of its
      // own surface by roughly the height it stands. Blocks then never meet.
      const per = perimeter(z.poly);
      const rin = per > 1e-9 ? 2 * planarArea(z.poly) / per : 0;
      let t = (Math.abs(z.v) / peak) * blockRef;
      t = Math.min(t, 1.35 * rin);                    // narrow zones get short blocks, not slabs
      if (t < span * 0.003 || rin < span * 0.002) return;
      const m = Math.min(0.62 * t, 0.40 * rin);
      const foot = insetFromSurfaceEdge(z.poly, s.poly, s.n, m);
      if (!foot || foot.length < 3) return;
      const off = mul(s.n, t);
      const top = foot.map(p => add(p, off));
      const mid = add(centroid(foot), mul(s.n, t / 2));
      const base = pressureColour(z.v, maxNeg, maxPos);
      for (let i = 0; i < foot.length; i++) {
        const j = (i + 1) % foot.length;
        const quad = [foot[i], foot[j], top[j], top[i]];
        const c = centroid(quad);
        let n = cross(sub(foot[j], foot[i]), off);
        if (Math.hypot(n[0], n[1], n[2]) < 1e-12) continue;
        n = norm(n);
        if (dot(n, sub(c, mid)) < 0) n = mul(n, -1);   // point away from the block's core
        if (dot(n, F) > -0.004) continue;              // inward face — hidden inside the block
        const lit = 0.72 + 0.34 * Math.max(0, dot(n, LIGHT));
        faces.push({
          poly: quad, fill: tint(base, lit * 0.97), stroke: 'rgba(22,33,43,.3)', sw: 0.55,
          depth: maxDepth(quad, F), tag: z.id + ':side'
        });
      }
      faces.push({
        poly: top, fill: tint(base, shade * 1.06), stroke: 'rgba(22,33,43,.4)', sw: 0.8,
        depth: maxDepth(top, F), label: z.id, gid: si + '.' + zi, cap: true, tag: z.id + ':cap',
        base: tint(base, shade * 1.06)
      });
    });
    faces.sort((a, b) => b.depth - a.depth);
    faces.forEach(f => items.push(f));
  });

  const arrow = windArrow(o.wind, [x0, x1], [y0, y1], span);
  const ground = scene.footprint ? scene.footprint.map(p => [p[0], p[1], z0]) : null;

  const proj = p => [dot(p, R), -dot(p, U)];
  const gather = items.flatMap(i => i.poly.map(proj));
  if (arrow) arrow.forEach(p => gather.push(proj(p)));
  if (ground) ground.forEach(p => gather.push(proj(p)));
  const pad = 14;
  const gx = [Math.min(...gather.map(p => p[0])), Math.max(...gather.map(p => p[0]))];
  const gy = [Math.min(...gather.map(p => p[1])), Math.max(...gather.map(p => p[1]))];
  const k = Math.min((W - 2 * pad) / Math.max(gx[1] - gx[0], 1e-6), (H - 2 * pad) / Math.max(gy[1] - gy[0], 1e-6));
  const ox = pad + ((W - 2 * pad) - (gx[1] - gx[0]) * k) / 2 - gx[0] * k;
  const oy = pad + ((H - 2 * pad) - (gy[1] - gy[0]) * k) / 2 - gy[0] * k;
  const SP = p => { const q = proj(p); return [q[0] * k + ox, q[1] * k + oy]; };
  const pstr = poly => poly.map(p => SP(p).map(v => v.toFixed(1)).join(',')).join(' ');

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="iso">`;
  if (ground) out += `<polygon points="${pstr(ground)}" fill="#16212b" opacity=".08"/>`;

  const labels = [];
  const draw = it => {
    if (it.outline) {
      out += `<polygon points="${pstr(it.poly)}" fill="none" stroke="#32465a" stroke-width="1.1" stroke-linejoin="round"/>`;
      return;
    }
    out += `<polygon points="${pstr(it.poly)}" fill="${it.fill}"`
      + (it.tag ? ` data-zone="${it.tag}"` : '')
      + (it.stroke ? ` stroke="${it.stroke}" stroke-width="${it.sw}" stroke-linejoin="round"` : '') + `/>`;
    if (it.label && o.label !== false) {
      const scr = it.poly.map(SP);
      let a = 0;
      for (let i = 0; i < scr.length; i++) { const q = scr[(i + 1) % scr.length]; a += scr[i][0] * q[1] - q[0] * scr[i][1]; }
      const area = Math.abs(a) / 2;
      if (area > 5) {   // everything is a candidate; placement decides inline or leader
        const c = scr.reduce((s, p) => [s[0] + p[0], s[1] + p[1]], [0, 0]).map(v => v / scr.length);
        labels.push({ x: c[0], y: c[1] + 4.5, t: it.label, area, scr, cx: c[0], cy: c[1],
          gid: it.gid, cap: !!it.cap, dark: luminance(it.base || '#ffffff') > 0.52 });
      }
    }
  };
  items.forEach(draw);
  // Every separate region gets its own letter, so a zone that appears at four
  // corners is named four times. A label on a long thin region may slide along
  // it to dodge a neighbour, and one too small to hold text gets a leader.
  const byId = new Map();
  labels.forEach(l => {
    const key = l.gid === undefined ? l.t : l.gid;
    const p = byId.get(key);
    const better = !p || (l.cap !== p.cap ? l.cap : l.area > p.area);   // a block top beats the flat zone under it
    if (better) byId.set(key, l);
  });
  const placed = [];
  const clear = (x, y) => !placed.some(p => Math.abs(p.x - x) < 18 && Math.abs(p.y - y) < 15);

  [...byId.values()].sort((a, b) => b.area - a.area).forEach(l => {
    if (l.area >= 200) {
      let A = l.scr[0], B = l.scr[0], best = -1;
      for (let i = 0; i < l.scr.length; i++) for (let j = i + 1; j < l.scr.length; j++) {
        const dd = Math.hypot(l.scr[i][0] - l.scr[j][0], l.scr[i][1] - l.scr[j][1]);
        if (dd > best) { best = dd; A = l.scr[i]; B = l.scr[j]; }
      }
      const ux = best > 1e-6 ? (B[0] - A[0]) / best : 1, uy = best > 1e-6 ? (B[1] - A[1]) / best : 0;
      for (const f of [0, 0.2, -0.2, 0.32, -0.32, 0.42, -0.42]) {
        const x = l.x + f * best * ux, y = l.y + f * best * uy;
        if (f !== 0 && !pointInPoly([x, y - 4.5], l.scr)) continue;
        if (!clear(x, y)) continue;
        placed.push({ ...l, x, y });
        return;
      }
    }
    let dx = l.cx - W / 2, dy = l.cy - H / 2;
    const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    for (const dist of [26, 40, 54, 68, 82]) {
      const x = Math.max(13, Math.min(W - 13, l.cx + dx * dist));
      const y = Math.max(17, Math.min(H - 6, l.cy + dy * dist));
      if (!clear(x, y)) continue;
      placed.push({ ...l, x, y, dark: true, leader: [l.cx, l.cy] });
      return;
    }
  });

  placed.forEach(l => {
    if (l.leader) {
      const ang = Math.atan2(l.y - 4.5 - l.leader[1], l.x - l.leader[0]);
      out += `<line x1="${l.leader[0].toFixed(1)}" y1="${l.leader[1].toFixed(1)}"`
        + ` x2="${(l.x - Math.cos(ang) * 8).toFixed(1)}" y2="${(l.y - 4.5 - Math.sin(ang) * 8).toFixed(1)}"`
        + ` stroke="#33465a" stroke-width="1" />`;
      out += `<circle cx="${l.leader[0].toFixed(1)}" cy="${l.leader[1].toFixed(1)}" r="1.7" fill="#33465a"/>`;
    }
    const at = `x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" text-anchor="middle"`
      + ` font-family="Barlow Condensed, Barlow, sans-serif" font-size="14.5" font-weight="600"`;
    out += `<text ${at} fill="none" stroke="${l.dark ? 'rgba(255,255,255,.9)' : 'rgba(8,16,24,.55)'}"`
      + ` stroke-width="3" stroke-linejoin="round">${l.t}</text>`;
    out += `<text ${at} fill="${l.dark ? '#15202b' : '#ffffff'}">${l.t}</text>`;
  });
  if (arrow) out += `<polygon points="${pstr(arrow)}" fill="#16212b" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>`;
  out += '</svg>';

  const zones = [];
  surfaces.forEach(s => s.zones.forEach(z => { if (!zones.some(q => q.id === z.id)) zones.push({ id: z.id, v: z.v }); }));
  return { svg: out, maxNeg, maxPos, zones };
}

function windArrow(wind, xr, yr, span) {
  if (!wind) return null;
  const L = span * 0.30, w = span * 0.034, head = span * 0.092, z = 0;
  const mk = pts => pts.map(p => [p[0], p[1], z]);
  if (wind === '0') {
    const y = (yr[0] + yr[1]) / 2, x = xr[0] - span * 0.15;
    return mk([[x - L, y - w], [x - head, y - w], [x - head, y - w * 2.3], [x, y],
    [x - head, y + w * 2.3], [x - head, y + w], [x - L, y + w]]);
  }
  if (wind === '180') {
    const y = yr[0] - span * 0.19, xt = (xr[0] + xr[1]) / 2 - L / 2;
    return mk([[xt + L, y - w], [xt + head, y - w], [xt + head, y - w * 2.3], [xt, y],
    [xt + head, y + w * 2.3], [xt + head, y + w], [xt + L, y + w]]);
  }
  const x = (xr[0] + xr[1]) / 2, y = yr[0] - span * 0.15;
  return mk([[x - w, y - L], [x - w, y - head], [x - w * 2.3, y - head], [x, y],
  [x + w * 2.3, y - head], [x + w, y - head], [x + w, y - L]]);
}

/* ============================================================
   Flat zone key — a dimensioned plan of the roof zones, drawn
   from the same clipped geometry as the 3D view so the two can
   never disagree.
   ============================================================ */

function renderZoneKey(g, dir, roofV, o = {}) {
  const sc = buildingScene(g, dir, null, roofV);
  const zones = [];
  sc.surfaces.forEach(s => { if (Math.abs(s.n[2]) > 0.01) s.zones.forEach(z => zones.push(z)); });
  const W = o.width || 430, H = o.height || 300;
  const mL = 52, mR = 26, mT = 30, mB = 46;
  const d = g.d, b = g.b, h = g.h;
  const across = dir === '90' ? d : b;
  const e = Math.min(across, 2 * h);
  const k = Math.min((W - mL - mR) / d, (H - mT - mB) / b);
  const X = x => mL + x * k;
  const Y = y => H - mB - y * k;                     // plan with y up the page
  const pstr = poly => poly.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');

  const vals = zones.map(z => z.v).filter(isFinite);
  const mn = o.scale ? o.scale.neg : Math.max(0, ...vals.map(v => -v), 0);
  const mx = o.scale ? o.scale.pos : Math.max(0, ...vals.map(v => v), 0);

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="key">`;
  out += `<rect x="${X(0)}" y="${Y(b)}" width="${(d * k).toFixed(1)}" height="${(b * k).toFixed(1)}" fill="#fbfcfd"/>`;
  zones.forEach(z => {
    const col = pressureColour(z.v, mn, mx);
    out += `<polygon points="${pstr(z.poly)}" fill="${col}" fill-opacity=".9" stroke="#fff" stroke-width="1"/>`;
  });
  out += `<rect x="${X(0)}" y="${Y(b)}" width="${(d * k).toFixed(1)}" height="${(b * k).toFixed(1)}" fill="none" stroke="#33465a" stroke-width="1.2"/>`;

  // one letter per region, at the centroid, skipping anything too small to read
  zones.forEach(z => {
    const cx = z.poly.reduce((s, p) => s + X(p[0]), 0) / z.poly.length;
    const cy = z.poly.reduce((s, p) => s + Y(p[1]), 0) / z.poly.length;
    let a = 0;
    for (let i = 0; i < z.poly.length; i++) {
      const j = (i + 1) % z.poly.length;
      a += X(z.poly[i][0]) * Y(z.poly[j][1]) - X(z.poly[j][0]) * Y(z.poly[i][1]);
    }
    const dark = luminance(pressureColour(z.v, mn, mx)) > 0.52;
    let tx = cx, ty = cy + 4, leader = null;
    if (Math.abs(a) / 2 < 150) {                       // too small to hold a letter: put it outside
      const left = cx < (X(0) + X(d)) / 2;
      tx = left ? X(0) - 16 : X(d) + 16;
      ty = cy + 4;
      leader = [cx, cy];
    }
    if (leader) {
      out += `<line x1="${leader[0].toFixed(1)}" y1="${leader[1].toFixed(1)}" x2="${tx.toFixed(1)}" y2="${(ty - 4).toFixed(1)}" stroke="#33465a" stroke-width="0.9"/>`;
      out += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600"`
        + ` font-family="Barlow Condensed, sans-serif" fill="#15202b">${z.id}</text>`;
      return;
    }
    out += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="13"`
      + ` font-weight="600" font-family="Barlow Condensed, sans-serif" fill="none"`
      + ` stroke="${dark ? 'rgba(255,255,255,.85)' : 'rgba(8,16,24,.5)'}" stroke-width="3">${z.id}</text>`
      + `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="13"`
      + ` font-weight="600" font-family="Barlow Condensed, sans-serif" fill="${dark ? '#15202b' : '#fff'}">${z.id}</text>`;
  });

  // dimension ticks on the two edges
  const tick = (px, py, tx, ty, label, anchor) =>
    `<line x1="${px}" y1="${py}" x2="${tx}" y2="${ty}" stroke="#8496a6" stroke-width="1"/>`
    + `<text x="${tx}" y="${ty + (anchor === 'below' ? 12 : 4)}" font-size="10" fill="#5d6f80"`
    + ` text-anchor="${anchor === 'below' ? 'middle' : 'end'}">${label}</text>`;
  const xMarks = [], yMarks = [];
  if (dir === '90') {
    yMarks.push([e / 10, 'e/10'], [e / 2, 'e/2']);
    xMarks.push([e / 4, 'e/4'], [d - e / 4, 'd−e/4']);
  } else if (dir === '180') {
    xMarks.push([d - e / 10, 'd−e/10']);
    yMarks.push([e / 4, 'e/4'], [b - e / 4, 'b−e/4']);
  } else {
    xMarks.push([e / 10, 'e/10'], [e / 2, 'e/2']);
    yMarks.push([e / 4, 'e/4'], [b - e / 4, 'b−e/4']);
  }
  xMarks.forEach(([v, l]) => { if (v > 0 && v < d) out += tick(X(v), Y(0), X(v), Y(0) + 7, l, 'below'); });
  yMarks.forEach(([v, l]) => { if (v > 0 && v < b) out += tick(X(0), Y(v), X(0) - 7, Y(v), l, 'left'); });

  // overall dimensions and the wind arrow
  out += `<text x="${((X(0) + X(d)) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="#5d6f80">d = ${fmtNum(d)} m</text>`;
  out += `<text x="${(X(d) + 14).toFixed(1)}" y="${((Y(0) + Y(b)) / 2).toFixed(1)}" text-anchor="middle" font-size="10.5"`
    + ` fill="#5d6f80" transform="rotate(-90 ${(X(d) + 14).toFixed(1)} ${((Y(0) + Y(b)) / 2).toFixed(1)})">b = ${fmtNum(b)} m</text>`;
  const ax = dir === '90' ? X(d / 2) : X(0) - 14, ay = dir === '90' ? Y(0) + 22 : Y(b / 2);
  const arr = dir === '90'
    ? `M${ax},${ay} L${ax},${ay - 16} M${ax},${ay - 16} l-4,5 M${ax},${ay - 16} l4,5`
    : `M${ax - 16},${ay} L${ax},${ay} M${ax},${ay} l-5,-4 M${ax},${ay} l-5,4`;
  out += `<path d="${arr}" stroke="#16212b" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  out += `<text x="${(W / 2).toFixed(1)}" y="14" text-anchor="middle" font-size="11" fill="#5d6f80">`
    + `plan on the roof · wind at ${dir}° · e = min(${dir === '90' ? 'd' : 'b'}, 2h) = ${fmtNum(e)} m</text>`;
  out += '</svg>';
  return out;
}
const fmtNum = v => (Math.round(v * 100) / 100).toFixed(2);

/* ============================================================
   Scene builders
   x: 0..d (along wind at 0°)   y: 0..b   z: up
   Every zone is obtained by clipping the surface's plan polygon,
   so zones always tile their surface exactly.
   ============================================================ */

function profileOf(type, h, d, alpha, alpha90) {
  const t = Math.tan((alpha || 0) * Math.PI / 180);
  if (type === 'flat') return { he: h, rise: 0, t: 0, zAt: () => h, ridge: null };
  if (type === 'mono') {
    const rise = d * t;
    return { he: h - rise, rise, t, zAt: x => (h - rise) + x * t, ridge: null };
  }
  const rise = (d / 2) * t, he = h - rise;
  const p = { he, rise, t, ridge: d / 2, zAt: x => he + Math.min(x, d - x) * t };
  if (type === 'hip') p.yRidge = rise / Math.max(Math.tan((alpha90 || alpha || 1) * Math.PI / 180), 1e-6);
  return p;
}

function lineCoef(p1, p2, inside) {
  let a = -(p2[1] - p1[1]), b = p2[0] - p1[0];
  const l = Math.hypot(a, b) || 1; a /= l; b /= l;
  let c = -(a * p1[0] + b * p1[1]);
  if (a * inside[0] + b * inside[1] + c < 0) { a = -a; b = -b; c = -c; }
  return [a, b, c];
}
/** Strip of width w on the `inside` of the line p1→p2. */
function nearLine(poly, p1, p2, inside, w) {
  const [a, b, c] = lineCoef(p1, p2, inside);
  return clipHalf(clipHalf(poly, a, b, c), -a, -b, -c + w);
}
/** Everything further than w from the line, on the `inside`. */
function farLine(poly, p1, p2, inside, w) {
  const [a, b, c] = lineCoef(p1, p2, inside);
  return clipHalf(poly, a, b, c - w);
}
const cenOf = pts => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];

/** Zone from a rectangular window over a surface's plan polygon. */
function zoneRect(surf, plan, zf, id, v, xlo, xhi, ylo, yhi) {
  let p = clipBand(plan, 0, xlo === undefined ? null : xlo, xhi === undefined ? null : xhi);
  p = clipBand(p, 1, ylo === undefined ? null : ylo, yhi === undefined ? null : yhi);
  addZone(surf, id, p, zf, v);
}

/* ---------- walls ---------- */

function wallOutline(prof, d, h) {
  // (s, z) outline of a side wall running along x
  const pts = [[0, 0], [d, 0], [d, prof.zAt(d)]];
  if (prof.ridge !== null && prof.ridge > 0 && prof.ridge < d) pts.push([prof.ridge, h]);
  pts.push([0, prof.zAt(0)]);
  return pts;
}

function addWallSurfaces(out, g, dir, W, prof) {
  const { h, b, d } = g;
  const hip = g.type === 'hip';
  const sideOutline = hip ? [[0, 0], [d, 0], [d, prof.he], [0, prof.he]] : wallOutline(prof, d, h);
  const endTop = x => hip ? prof.he : prof.zAt(x);
  const endOutline = x => [[0, 0], [b, 0], [b, endTop(x)], [0, endTop(x)]];

  const sideMap = y => (s, z) => [s, y, z];
  const endMap = x => (s, z) => [x, s, z];

  const s0 = vertSurface(sideOutline, sideMap(0), [0, -1, 0]);
  const s1 = vertSurface(sideOutline, sideMap(b), [0, 1, 0]);
  const e0 = vertSurface(endOutline(0), endMap(0), [-1, 0, 0]);
  const e1 = vertSurface(endOutline(d), endMap(d), [1, 0, 0]);
  out.push(s0, s1, e0, e1);
  if (!W) return;

  const along = dir === '90' ? b : d;
  const across = dir === '90' ? d : b;
  const e = Math.min(across, 2 * h);
  const segs = [];
  if (e < along) segs.push(['A', 0, e / 5], ['B', e / 5, e], ['C', e, along]);
  else if (e < 5 * along) segs.push(['A', 0, e / 5], ['B', e / 5, along]);
  else segs.push(['A', 0, along]);

  const band = (outline, lo, hi) => clipBand(outline, 0, lo, hi);
  if (dir === '90') {
    segs.forEach(([id, a0, a1]) => {
      addVertZone(e0, id, band(endOutline(0), a0, a1), endMap(0), W[id]);
      addVertZone(e1, id, band(endOutline(d), a0, a1), endMap(d), W[id]);
    });
    addVertZone(s0, 'D', sideOutline, sideMap(0), W.D);
    addVertZone(s1, 'E', sideOutline, sideMap(b), W.E);
  } else if (dir === '180') {
    segs.forEach(([id, a0, a1]) => {
      addVertZone(s0, id, band(sideOutline, d - a1, d - a0), sideMap(0), W[id]);
      addVertZone(s1, id, band(sideOutline, d - a1, d - a0), sideMap(b), W[id]);
    });
    addVertZone(e1, 'D', endOutline(d), endMap(d), W.D);
    addVertZone(e0, 'E', endOutline(0), endMap(0), W.E);
  } else {
    segs.forEach(([id, a0, a1]) => {
      addVertZone(s0, id, band(sideOutline, a0, a1), sideMap(0), W[id]);
      addVertZone(s1, id, band(sideOutline, a0, a1), sideMap(b), W[id]);
    });
    addVertZone(e0, 'D', endOutline(0), endMap(0), W.D);
    addVertZone(e1, 'E', endOutline(d), endMap(d), W.E);
  }
}

/* ---------- the building ---------- */

function buildingScene(g, dir, W, P) {
  const { type, h, b, d } = g;
  const prof = profileOf(type, h, d, g.alpha, g.alpha90);
  const surfaces = [];
  addWallSurfaces(surfaces, g, dir, W, prof);
  const R = P || {};
  const e = Math.min(dir === '90' ? d : b, 2 * h);
  const e4 = e / 4, e10 = e / 10, e2 = e / 2;
  const rect = [[0, 0], [d, 0], [d, b], [0, b]];

  if (type === 'hip') {
    hipRoofSurfaces(surfaces, g, dir, R, prof, e);
  } else if (type === 'flat') {
    const s = surface(lift(rect, () => h), [0, 0, 1]);
    surfaces.push(s);
    const zf = () => h;
    if (dir === '90') {
      zoneRect(s, rect, zf, 'F', R.F, 0, e4, 0, e10);
      zoneRect(s, rect, zf, 'F', R.F, d - e4, d, 0, e10);
      zoneRect(s, rect, zf, 'G', R.G, e4, d - e4, 0, e10);
      zoneRect(s, rect, zf, 'H', R.H, null, null, e10, e2);
      zoneRect(s, rect, zf, 'I', R.I, null, null, e2, b);
    } else {
      zoneRect(s, rect, zf, 'F', R.F, 0, e10, 0, e4);
      zoneRect(s, rect, zf, 'F', R.F, 0, e10, b - e4, b);
      zoneRect(s, rect, zf, 'G', R.G, 0, e10, e4, b - e4);
      zoneRect(s, rect, zf, 'H', R.H, e10, e2);
      zoneRect(s, rect, zf, 'I', R.I, e2, d);
    }
  } else if (type === 'mono') {
    const zf = x => prof.zAt(x);
    const s = surface(lift(rect, zf), [-prof.t, 0, 1]);
    surfaces.push(s);
    if (dir === '90') {
      zoneRect(s, rect, zf, 'Flow', R.Flow, 0, e4, 0, e10);
      zoneRect(s, rect, zf, 'Fup', R.Fup, d - e4, d, 0, e10);
      zoneRect(s, rect, zf, 'G', R.G, e4, d - e4, 0, e10);
      zoneRect(s, rect, zf, 'H', R.H, null, null, e10, e2);
      zoneRect(s, rect, zf, 'I', R.I, null, null, e2, b);
    } else if (dir === '180') {
      zoneRect(s, rect, zf, 'F', R.F, d - e10, d, 0, e4);
      zoneRect(s, rect, zf, 'F', R.F, d - e10, d, b - e4, b);
      zoneRect(s, rect, zf, 'G', R.G, d - e10, d, e4, b - e4);
      zoneRect(s, rect, zf, 'H', R.H, 0, d - e10);
    } else {
      zoneRect(s, rect, zf, 'F', R.F, 0, e10, 0, e4);
      zoneRect(s, rect, zf, 'F', R.F, 0, e10, b - e4, b);
      zoneRect(s, rect, zf, 'G', R.G, 0, e10, e4, b - e4);
      zoneRect(s, rect, zf, 'H', R.H, e10, d);
    }
  } else {   // duo
    const zw = x => prof.he + x * prof.t, zl = x => prof.he + (d - x) * prof.t;
    const planW = [[0, 0], [d / 2, 0], [d / 2, b], [0, b]];
    const planL = [[d / 2, 0], [d, 0], [d, b], [d / 2, b]];
    const sw = surface(lift(planW, zw), [-prof.t, 0, 1]);
    const sl = surface(lift(planL, zl), [prof.t, 0, 1]);
    surfaces.push(sw, sl);
    if (dir === '90') {
      zoneRect(sw, planW, zw, 'F', R.F, 0, e4, 0, e10);
      zoneRect(sw, planW, zw, 'G', R.G, e4, d / 2, 0, e10);
      zoneRect(sw, planW, zw, 'H', R.H, null, null, e10, e2);
      zoneRect(sw, planW, zw, 'I', R.I, null, null, e2, b);
      zoneRect(sl, planL, zl, 'F', R.F, d - e4, d, 0, e10);
      zoneRect(sl, planL, zl, 'G', R.G, d / 2, d - e4, 0, e10);
      zoneRect(sl, planL, zl, 'H', R.H, null, null, e10, e2);
      zoneRect(sl, planL, zl, 'I', R.I, null, null, e2, b);
    } else {
      zoneRect(sw, planW, zw, 'F', R.F, 0, e10, 0, e4);
      zoneRect(sw, planW, zw, 'F', R.F, 0, e10, b - e4, b);
      zoneRect(sw, planW, zw, 'G', R.G, 0, e10, e4, b - e4);
      zoneRect(sw, planW, zw, 'H', R.H, e10, d / 2);
      zoneRect(sl, planL, zl, 'J', R.J, d / 2, d / 2 + e10);
      zoneRect(sl, planL, zl, 'I', R.I, d / 2 + e10, d);
    }
  }
  return { surfaces, footprint: [[0, 0], [d, 0], [d, b], [0, b]] };
}

/* ---------- hipped roof ---------- */

function hipRoofSurfaces(out, g, dir, R, prof, e) {
  const { h, b, d } = g;
  const yr = Math.min(Math.max(prof.yRidge || 0.001, 1e-3), b / 2 - 1e-3);
  const e4 = e / 4, e10 = e / 10, e2 = e / 2;
  const zMain = x => prof.he + (h - prof.he) * (Math.min(x, d - x) / (d / 2));
  const zEnd = (x, y) => prof.he + (h - prof.he) * (Math.min(y, b - y) / yr);

  const planW = [[0, 0], [d / 2, yr], [d / 2, b - yr], [0, b]];
  const planL = [[d, 0], [d, b], [d / 2, b - yr], [d / 2, yr]];
  const planE0 = [[0, 0], [d, 0], [d / 2, yr]];
  const planE1 = [[0, b], [d / 2, b - yr], [d, b]];
  const t90 = (h - prof.he) / yr;
  const sw = surface(lift(planW, zMain), [-prof.t, 0, 1]);
  const sl = surface(lift(planL, zMain), [prof.t, 0, 1]);
  const s0 = surface(lift(planE0, zEnd), [0, -t90, 1]);
  const s1 = surface(lift(planE1, zEnd), [0, t90, 1]);
  out.push(sw, sl, s0, s1);

  const endZones = (surf, plan, A, apex, B, mainId, stripId) => {
    const c = cenOf(plan);
    addZone(surf, mainId, farLine(farLine(plan, A, apex, c, e10), B, apex, c, e10), zEnd, R[mainId]);
    addZone(surf, stripId, nearLine(plan, A, apex, c, e10), zEnd, R[stripId]);
    addZone(surf, stripId, nearLine(plan, B, apex, c, e10), zEnd, R[stripId]);
  };

  if (dir === '90') {
    // windward hip end at y = 0
    const strip = clipBand(planE0, 1, 0, e10);
    addZone(s0, 'F', clipBand(strip, 0, 0, e4), zEnd, R.F);
    addZone(s0, 'F', clipBand(strip, 0, d - e4, d), zEnd, R.F);
    addZone(s0, 'G', clipBand(strip, 0, e4, d - e4), zEnd, R.G);
    const rest0 = clipBand(planE0, 1, e10, null);
    if (rest0.length >= 3) {
      const c = cenOf(planE0), apex = planE0[2];
      addZone(s0, 'M', farLine(farLine(rest0, planE0[0], apex, c, e10), planE0[1], apex, c, e10), zEnd, R.M);
      addZone(s0, 'L', nearLine(rest0, planE0[0], apex, c, e10), zEnd, R.L);
      addZone(s0, 'L', nearLine(rest0, planE0[1], apex, c, e10), zEnd, R.L);
    }
    endZones(s1, planE1, planE1[0], planE1[1], planE1[2], 'N', 'L');
    [[sw, planW, d / 2 - e10, d / 2], [sl, planL, d / 2, d / 2 + e10]].forEach(([surf, plan, j0, j1]) => {
      const core = surf === sw ? clipBand(plan, 0, null, d / 2 - e10) : clipBand(plan, 0, d / 2 + e10, null);
      addZone(surf, 'F', clipBand(plan, 1, null, e10), zMain, R.F);   // windward eaves wedge
      addZone(surf, 'J', clipBand(clipBand(plan, 0, j0, j1), 1, e10, null), zMain, R.J);
      addZone(surf, 'H', clipBand(core, 1, e10, e2), zMain, R.H);
      addZone(surf, 'I', clipBand(core, 1, e2, null), zMain, R.I);
    });
  } else {
    zoneRect(sw, planW, zMain, 'F', R.F, 0, e10, 0, e4);
    zoneRect(sw, planW, zMain, 'F', R.F, 0, e10, b - e4, b);
    zoneRect(sw, planW, zMain, 'G', R.G, 0, e10, e4, b - e4);
    zoneRect(sw, planW, zMain, 'H', R.H, e10, d / 2);
    zoneRect(sl, planL, zMain, 'J', R.J, d / 2, d / 2 + e10);
    zoneRect(sl, planL, zMain, 'I', R.I, d / 2 + e10, d);
    // hip ends: strip along each hip ridge is L, a cap at the apex is K, the rest is M
    [[s0, planE0], [s1, planE1]].forEach(([surf, plan], i) => {
      const apex = i === 0 ? plan[2] : plan[1];
      const A = plan[0], Bp = i === 0 ? plan[1] : plan[2];
      const c = cenOf(plan);
      const cap = i === 0 ? clipBand(plan, 1, yr - e10, null) : clipBand(plan, 1, null, b - yr + e10);
      const rest = i === 0 ? clipBand(plan, 1, null, yr - e10) : clipBand(plan, 1, b - yr + e10, null);
      if (R.K !== undefined && cap.length >= 3) addZone(surf, 'K', cap, zEnd, R.K);
      const base = (R.K !== undefined && cap.length >= 3) ? rest : plan;
      if (base.length >= 3) {
        addZone(surf, 'M', farLine(farLine(base, A, apex, c, e10), Bp, apex, c, e10), zEnd, R.M);
        addZone(surf, 'L', nearLine(base, A, apex, c, e10), zEnd, R.L);
        addZone(surf, 'L', nearLine(base, Bp, apex, c, e10), zEnd, R.L);
      }
    });
  }
}

/* ---------- boxes, canopies, plates ---------- */

function boxSurfaces(x0, x1, y0, y1, z0, z1, body, noTop) {
  const o = { body: body || '#9fb0bf' };
  const f = [
    surface([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], [-1, 0, 0], o),
    surface([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], [1, 0, 0], o),
    surface([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], [0, -1, 0], o),
    surface([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], [0, 1, 0], o),
    surface([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [0, 0, 1], o)
  ];
  return noTop ? f.slice(0, 4) : f;
}

function canopyScene(kind, g, Z) {
  const { h, b, d } = g;
  const t = Math.max(Math.min(b, d) * 0.035, 1e-3);
  const tan = Math.tan((g.alpha || 0) * Math.PI / 180);
  const surfaces = [];
  const mono = kind === 'mono';
  const zTop = mono ? x => (h - d * tan) + x * tan : x => (h - (d / 2) * tan) + Math.min(x, d - x) * tan;
  const halves = mono
    ? [[[[0, 0], [d, 0], [d, b], [0, b]], [-tan, 0, 1]]]
    : [[[[0, 0], [d / 2, 0], [d / 2, b], [0, b]], [-tan, 0, 1]],
    [[[d / 2, 0], [d, 0], [d, b], [d / 2, b]], [tan, 0, 1]]];

  const b10 = b / 10, d10 = d / 10;
  halves.forEach(([plan, n]) => {
    const s = surface(lift(plan, zTop), n);
    surfaces.push(s);
    // underside and edges, plain
    surfaces.push(surface(lift(plan, x => zTop(x) - t).reverse(), [-n[0], -n[1], -1], { body: '#9fb0bf' }));
    const R = (id, v, xl, xh, yl, yh) => zoneRect(s, plan, zTop, id, v, xl, xh, yl, yh);
    R('C', Z.C, 0, d10, 0, b10); R('C', Z.C, 0, d10, b - b10, b);
    R('C', Z.C, d - d10, d, 0, b10); R('C', Z.C, d - d10, d, b - b10, b);
    R('B', Z.B, 0, d10, b10, b - b10); R('B', Z.B, d - d10, d, b10, b - b10);
    R('B', Z.B, d10, d - d10, 0, b10); R('B', Z.B, d10, d - d10, b - b10, b);
    const mid = (!mono && Z.D !== undefined && plan[0][0] >= d / 2 - 1e-9) ? 'D' : 'A';
    R(mid, Z[mid], d10, d - d10, b10, b - b10);
  });
  // Slab edges. The two that run along x must follow the roof profile — on a
  // duo-pitch that means through the ridge. Cutting them straight from eaves to
  // eaves left a flat band hanging in space under the ridge.
  const profX = mono ? [0, d] : [0, d / 2, d];
  const edgeY = (yv, n) => surfaces.push(surface(
    profX.map(x => [x, yv, zTop(x)])
      .concat(profX.slice().reverse().map(x => [x, yv, zTop(x) - t])), n, { body: '#c2ced9' }));
  const edgeX = (xv, n) => surfaces.push(surface(
    [[xv, 0, zTop(xv)], [xv, b, zTop(xv)], [xv, b, zTop(xv) - t], [xv, 0, zTop(xv) - t]],
    n, { body: '#c2ced9' }));
  edgeX(0, [-1, 0, 0]); edgeX(d, [1, 0, 0]);
  edgeY(0, [0, -1, 0]); edgeY(b, [0, 1, 0]);

  // Columns stop at the underside of the slab, and are set far enough in from
  // its edge that the slab covers them in this view: at a shallow viewing angle
  // you can see past the edge by about the slab thickness over tan(elevation).
  // order = -1 keeps them behind the slab whatever the depth sort decides.
  const cw = Math.max(Math.min(b, d) * 0.028, 1e-3);
  const reach = t / Math.max(Math.tan(Math.abs(VIEW.el)), 0.2);
  const ix = Math.min(Math.max(d * 0.14, reach + cw * 1.5), d * 0.34);
  const iy = Math.min(Math.max(b * 0.12, reach + cw * 1.5), b * 0.34);
  [[ix, iy], [d - ix, iy], [ix, b - iy], [d - ix, b - iy]]
    .forEach(([cx, cy]) => boxSurfaces(cx - cw, cx + cw, cy - cw, cy + cw, 0, zTop(cx) - t, '#aebccb', true)
      .forEach(su => { su.order = -1; surfaces.push(su); }));

  return { surfaces, footprint: [[0, 0], [d, 0], [d, b], [0, b]] };
}

/** Vertical plate (free-standing wall, parapet, signboard) with zones along its length. */
function plateScene(zones, values, h, L, t, zBase, post) {
  const surfaces = [];
  const front = [[0, zBase], [L, zBase], [L, zBase + h], [0, zBase + h]];
  const fMap = (s, z) => [0, s, z], bMap = (s, z) => [t, s, z];
  const sf = vertSurface(front, fMap, [-1, 0, 0]);
  const sb = vertSurface(front, bMap, [1, 0, 0]);
  surfaces.push(sf, sb);
  zones.forEach(z => {
    const w = clipBand(front, 0, z.x0, z.x1);
    addVertZone(sf, z.id, w, fMap, values[z.id]);
    addVertZone(sb, z.id, w, bMap, values[z.id]);
  });
  surfaces.push(surface([[0, 0, zBase], [t, 0, zBase], [t, 0, zBase + h], [0, 0, zBase + h]], [0, -1, 0], { body: '#b9c6d2' }));
  surfaces.push(surface([[0, L, zBase], [t, L, zBase], [t, L, zBase + h], [0, L, zBase + h]], [0, 1, 0], { body: '#b9c6d2' }));
  surfaces.push(surface([[0, 0, zBase + h], [t, 0, zBase + h], [t, L, zBase + h], [0, L, zBase + h]], [0, 0, 1], { body: '#c6d2dc' }));
  if (post && zBase > 0) {
    // The post runs up into the board rather than stopping flush underneath it,
    // so its top face is buried behind the panel instead of showing as a step in
    // front of it. order = -1 keeps it behind the board whatever the depth sort.
    const pw = Math.min(t * 0.9, L * 0.035);
    const top = zBase + Math.min(0.12 * h, zBase);
    boxSurfaces(0, t, L / 2 - pw, L / 2 + pw, 0, top, '#9fb0bf')
      .forEach(su => { su.order = -1; surfaces.push(su); });
  }
  return { surfaces, footprint: [[0, 0], [t, 0], [t, L], [0, L]] };
}

/* ============================================================
   Resultant forces from the zone pressures on the envelope
   ============================================================ */

/**
 * Sum the surface pressures over a scene into a resultant force.
 * Pressure acting on a surface pushes along -n, so the force on the
 * structure from a zone is  -(we - qp*cpi) * area * n.
 * @returns {roof:[Fx,Fy,Fz], walls:[...], area:{roof,walls}} in kN
 */
function sceneResultants(scene, qp, cpi) {
  const R = { roof: [0, 0, 0], walls: [0, 0, 0], areaRoof: 0, areaWalls: 0 };
  scene.surfaces.forEach(s => s.zones.forEach(z => {
    if (!isFinite(z.v)) return;
    const A = planarArea(z.poly);
    const w = z.v - qp * (cpi || 0);
    const vertical = Math.abs(s.n[2]) > 0.01;
    const t = vertical ? R.roof : R.walls;
    for (let i = 0; i < 3; i++) t[i] += -w * A * s.n[i];
    if (vertical) R.areaRoof += A; else R.areaWalls += A;
  }));
  return R;
}

/** Roof and wall resultants for one wind direction, for both internal pressure cases. */
function envelopeForces(g, dir, wallV, roofV, qp, cpiPos, cpiNeg) {
  const sc = buildingScene(g, dir, wallV, roofV);
  const along = dir === '90' ? 1 : 0;
  const pack = cpi => {
    const r = sceneResultants(sc, qp, cpi);
    return {
      cpi,
      roofVert: r.roof[2], roofAlong: r.roof[along],
      wallAlong: r.walls[along], areaRoof: r.areaRoof,
      totalAlong: r.roof[along] + r.walls[along]
    };
  };
  return { pos: pack(cpiPos), neg: pack(cpiNeg) };
}

/* ============================================================
   Word (.docx) output
   A .docx is a ZIP of XML parts. Everything here is built by
   hand so the tool stays a single file with no dependencies
   and keeps working offline.
   ============================================================ */

/* ---------- ZIP (stored, no compression — Word accepts it) ---------- */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/** @param files [{name, text}] or [{name, bytes}] -> Uint8Array of a ZIP archive */
function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;

  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = f.bytes ? f.bytes : enc.encode(f.text);
    const crc = crc32(data);

    const local = new Uint8Array(30 + name.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(8, 0, true);            // stored
    lv.setUint16(12, 0x21, true);        // 1980-01-01
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true);
    local.set(name, 30);

    const cen = new Uint8Array(46 + name.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    cen.set(name, 46);

    parts.push(local, data);
    central.push(cen);
    offset += local.length + data.length;
  });

  const cenSize = central.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cenSize, true);
  ev.setUint32(16, offset, true);

  const all = [...parts, ...central, end];
  const total = all.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(a => { out.set(a, p); p += a.length; });
  return out;
}

/* ---------- OOXML helpers ---------- */

const xesc = s => String(s === null || s === undefined ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/\u2013|\u2014/g, '-').replace(/[−–—]/g, '-');

function wRun(text, o = {}) {
  const pr = '<w:rPr>' + (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '')
    + (o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : '')
    + (o.color ? `<w:color w:val="${o.color}"/>` : '')
    + (o.caps ? '<w:caps/>' : '') + '</w:rPr>';
  return `<w:r>${pr}<w:t xml:space="preserve">${xesc(text)}</w:t></w:r>`;
}

function wPara(runs, o = {}) {
  const pr = '<w:pPr>'
    + (o.align ? `<w:jc w:val="${o.align}"/>` : '')
    + `<w:spacing w:before="${o.before === undefined ? 0 : o.before}" w:after="${o.after === undefined ? 100 : o.after}"/>`
    + (o.keep ? '<w:keepNext/>' : '')
    + (o.rule ? '<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="3" w:color="0E3763"/></w:pBdr>' : '')
    + (o.ind ? `<w:ind w:left="${o.ind}" w:hanging="${o.hanging || 0}"/>` : '')
    + '</w:pPr>';
  return `<w:p>${pr}${Array.isArray(runs) ? runs.join('') : runs}</w:p>`;
}

const wBreak = () => '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
const wSpace = (h) => wPara('', { after: h === undefined ? 160 : h });

function wHead(n, text) {
  return wPara(wRun(text, { b: true, sz: n === 1 ? 26 : 22, color: n === 1 ? '0E3763' : '25384B' }),
    { before: n === 1 ? 300 : 220, after: n === 1 ? 120 : 90, keep: true, rule: n === 1 });
}

function wCell(text, o = {}) {
  const shd = o.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>` : '';
  const body = (Array.isArray(text) ? text : [text]).map(t =>
    wPara(wRun(t, { b: o.b, sz: o.sz || 18 }), { align: o.align, after: 20 })).join('');
  return `<w:tc><w:tcPr><w:tcW w:w="${o.w || 0}" w:type="dxa"/>${shd}`
    + `<w:vAlign w:val="center"/></w:tcPr>${body}</w:tc>`;
}

/**
 * @param cols  [{w, label, align}]
 * @param rows  [[cell, ...]]  cell may be a string or {t, b, align}
 */
function wTable(cols, rows) {
  const borders = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV']
    .map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="A7B4C0"/>`).join('');
  const head = `<w:tr><w:trPr><w:tblHeader/></w:trPr>`
    + cols.map(c => wCell(c.label, { w: c.w, b: true, fill: 'E7EEF4', align: c.align })).join('')
    + '</w:tr>';
  const body = rows.map(r => '<w:tr>' + r.map((cell, i) => {
    const o = typeof cell === 'object' && cell !== null ? cell : { t: cell };
    return wCell(o.t, { w: cols[i].w, b: o.b, align: o.align || cols[i].align });
  }).join('') + '</w:tr>').join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>${borders}</w:tblBorders>`
    + `<w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="80" w:type="dxa"/>`
    + `<w:bottom w:w="40" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>`
    + `<w:tblGrid>${cols.map(c => `<w:gridCol w:w="${c.w}"/>`).join('')}</w:tblGrid>${head}${body}</w:tbl>`;
}

/** Rasterise an inline SVG through a canvas. Browser only. */
function svgToPng(svg, scale) {
  return new Promise((resolve, reject) => {
    const m = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
    const w = m ? +m[1] : 420, h = m ? +m[2] : 280;
    const sized = svg.replace('<svg ', `<svg width="${w}" height="${h}" `);
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = Math.round(w * scale); c.height = Math.round(h * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const b64 = c.toDataURL('image/png').split(',')[1];
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve({ bytes, w, h });
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('SVG could not be rasterised'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sized);
  });
}

/** Which illustrations the report carries, in order. */
function reportFigureSpecs() {
  const g = S.g, q = qpRef(), c = roofCoeffs();
  const V = o => { const m = {}; Object.keys(o).forEach(k => m[k] = o[k].cpe * q); return m; };
  const roofAt = dir => g.type === 'flat' ? V(c.flat)
    : g.type === 'mono' ? V(dir === '90' ? c.deg90 : dir === '180' ? c.deg180 : c.deg0neg)
      : g.type === 'duo' ? V(dir === '90' ? c.deg90 : c.deg0neg)
        : V(dir === '90' ? c.deg90 : c.deg0);
  const specs = [
    { key: 'w0', wind: '0', scene: buildingScene(g, '0', wallP('0').p, roofAt('0')),
      cap: 'External pressure zones — wind at 0°' },
    { key: 'w90', wind: '90', scene: buildingScene(g, '90', wallP('90').p, roofAt('90')),
      cap: 'External pressure zones — wind at 90°' }
  ];
  if (g.type === 'mono') specs.push({ key: 'w180', wind: '180',
    scene: buildingScene(g, '180', null, roofAt('180')), cap: 'External pressure zones — wind at 180°' });
  const figRef = { flat: 'Figure 8', mono: 'Figure 9', duo: 'Figure 11', hip: 'Figure 12' }[g.type];
  specs.push({ key: 'k0', svg: renderZoneKey(g, '0', roofAt('0'), { width: 440, height: 300 }),
    cap: `Roof zone key, wind at 0° — layout to ${figRef}` });
  specs.push({ key: 'k90', svg: renderZoneKey(g, '90', roofAt('90'), { width: 440, height: 300 }),
    cap: `Roof zone key, wind at 90° — layout to ${figRef}` });
  if (String(S.doc.incCanopy) === 'true') {
    const cn = S.can, qc = qpAt(cn.h);
    const r = cn.kind === 'mono' ? canopyMono(+cn.alpha, +cn.phi, 10) : canopyDuo(+cn.alpha, +cn.phi);
    const Z = {}; Object.keys(r.zones).forEach(k => Z[k] = r.zones[k].min * qc);
    specs.push({ key: 'can', wind: '0', scene: canopyScene(cn.kind, { h: +cn.h, b: +cn.b, d: +cn.d, alpha: +cn.alpha }, Z),
      cap: 'Canopy net pressure zones — maximum uplift' });
  }
  if (String(S.doc.incFree) === 'true') {
    const f = S.fw;
    if (f.mode === 'sign') {
      const sb = signboard(+f.sh, +f.sb, +f.shg), qs = qpAt(sb.ze);
      specs.push({ key: 'free', wind: '0', cap: 'Signboard — net pressure',
        scene: plateScene([{ id: 'A', x0: 0, x1: +f.sb }], { A: sb.cf * qs }, +f.sh, +f.sb,
          Math.min(f.sb, f.sh) * 0.06, +f.shg, true) });
    } else {
      const h = +f.h, zRef = f.mode === 'parapet' ? +f.hb + h : h, qw = qpAt(zRef);
      const r = freeWall(h, +f.L, +f.Lc, +f.phi), v = {};
      Object.keys(r.cpNet).forEach(k => v[k] = r.cpNet[k] * qw);
      specs.push({ key: 'free', wind: '0', cap: 'Free-standing wall — net pressure zones',
        scene: plateScene(r.zones, v, h, +f.L, Math.min(h, f.L) * 0.08, f.mode === 'parapet' ? +f.hb : 0, false) });
    }
  }
  return specs;
}

async function collectFigures() {
  const out = [];
  for (const sp of reportFigureSpecs()) {
    const r = sp.svg ? { svg: sp.svg } : renderScene(sp.scene, { wind: sp.wind, width: 460, height: 300, mode: S.view });
    const png = await svgToPng(r.svg, 2.5);
    out.push({ key: sp.key, cap: sp.cap, bytes: png.bytes, w: png.w, h: png.h });
  }
  return out;
}

async function downloadDocx(btn) {
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Preparing report…'; }
  try {
    const bytes = await buildDocx();
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const name = ((S.doc.job ? S.doc.job + ' ' : '') + (S.doc.project || 'Wind actions') + ' - wind report')
      .replace(/[\\/:*?"<>|]/g, '-').slice(0, 90) + '.docx';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

const PROJECT_FORMAT = 'sans-wind-3';

function projectBlob() {
  return JSON.stringify({
    format: PROJECT_FORMAT, version: 1,
    saved: new Date().toISOString(),
    standard: 'SANS 10160-3:2018 Ed 2.0',
    state: S
  }, null, 2);
}

function projectName(ext) {
  const base = (S.doc.job ? S.doc.job + ' ' : '') + (S.doc.project || S.doc.structure || 'Wind actions');
  return base.replace(/[\\/:*?"<>|]/g, '-').trim().slice(0, 90) + ext;
}

function saveProject() {
  const blob = new Blob([projectBlob()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = projectName('.windproj.json');
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('Project saved as ' + a.download);
}

/** Copy saved values into the live state, key by key, ignoring anything unknown. */
function mergeState(dst, src) {
  if (!src || typeof src !== 'object') return;
  Object.keys(dst).forEach(k => {
    if (!(k in src)) return;
    const a = dst[k], b = src[k];
    if (b === null || b === undefined) return;
    if (Array.isArray(a) && Array.isArray(b)) {
      for (let i = 0; i < a.length && i < b.length; i++) if (typeof b[i] !== 'object') a[i] = b[i];
    } else if (a && typeof a === 'object' && typeof b === 'object') {
      mergeState(a, b);
    } else if (typeof b !== 'object') {
      dst[k] = b;
    }
  });
}

function openProject(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || o.format !== PROJECT_FORMAT) {
        toast('That file is not a SANS Wind project file.', true);
        return;
      }
      mergeState(S, o.state);
      renderAll();
      toast('Opened ' + (S.doc.project || file.name));
    } catch (e) {
      toast('The project file could not be read: ' + e.message, true);
    }
  };
  r.onerror = () => toast('The file could not be read.', true);
  r.readAsText(file);
}

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; }, 2600);
  setTimeout(() => t.remove(), 3200);
}

/* ---------- derived values ---------- */

function site() {
  return sitePressure({ vb0: S.vb0, returnPeriod: S.T, terrain: S.terrain, c0: S.c0, altitude: S.altitude });
}
function qpAt(z) { return site().at(z).qp; }
function qpRef() { return qpAt(S.g.h); }

/** roof coefficients for the active roof type, keyed by wind direction */
function roofCoeffs() {
  const { type, alpha, alpha90, A } = S.g;
  if (type === 'flat') {
    const e = S.edge;
    const spec = e.type === 'parapet' ? { type: 'parapet', hp_h: e.hp / S.g.h }
      : e.type === 'curved' ? { type: 'curved', r_h: e.r / S.g.h }
        : e.type === 'mansard' ? { type: 'mansard', alpha: e.mansard } : { type: 'sharp' };
    const c = flatRoofCpe(spec, A);
    return { flat: c };
  }
  if (type === 'mono') return monoCpe(alpha, A);
  if (type === 'duo') return duoCpe(alpha, A);
  return hipCpe(alpha, alpha90, A);
}

function wallP(dir) {
  const { h, b, d, A } = S.g;
  const w = dir === '90' ? wallZones(h, d, b, A) : wallZones(h, b, d, A);
  const q = qpRef(), o = {};
  ['A', 'B', 'C', 'D', 'E'].forEach(k => o[k] = w.cpe[k].cpe * q);
  return { w, p: o };
}
