function figs(list) {
  let neg = 0, pos = 0;
  list.forEach(f => f.scene.surfaces.forEach(s => s.zones.forEach(z => {
    if (isFinite(z.v)) { neg = Math.max(neg, -z.v); pos = Math.max(pos, z.v); }
  })));
  const scale = { neg, pos };
  const toggle = `<div class="vtoggle">` + [['shaded', 'Zone colours'], ['blocks', 'Pressure blocks']].map(([k, n]) =>
    `<button data-view="${k}" aria-pressed="${S.view === k}">${n}</button>`).join('')
    + `<span>colour scale shared across these views: ${fmt(-neg, 2)} to +${fmt(pos, 2)} kPa</span></div>`;
  return toggle + '<div class="figs">' + list.map(f => figure(f.t, f.c, f.scene, f.w, scale)).join('') + '</div>';
}

function thumb(type) {
  const g = { type, h: 10, b: 24, d: 14, alpha: 25, alpha90: 30 };
  return renderScene(buildingScene(g, '0', null, null), { width: 118, height: 60, label: false }).svg;
}
function canopyThumb(kind) {
  return renderScene(canopyScene(kind, { h: 4, b: 14, d: 9, alpha: 12 }, {}), { width: 118, height: 60, label: false }).svg;
}

function coeffRows(obj, q, keys) {
  return (keys || Object.keys(obj)).filter(k => obj[k]).map(k => {
    const c = obj[k], we = c.cpe * q;
    return `<tr><td class="z"><span class="sw" style="background:${pressureColour(we, 1, 1)}"></span>${k}</td>
      <td>${fmt(c.cpe10)}</td><td>${fmt(c.cpe1)}</td><td>${fmt(c.cpe)}</td>
      <td class="${sgn(we)}">${fmt(we, 3)}</td>
      <td class="${sgn(we - q * S.cpiPos)}">${fmt(we - q * S.cpiPos, 3)}</td>
      <td class="${sgn(we - q * S.cpiNeg)}">${fmt(we - q * S.cpiNeg, 3)}</td></tr>`;
  }).join('');
}
const COEFF_HEAD = `<thead><tr><th>Zone</th><th>C<sub>pe,10</sub></th><th>C<sub>pe,1</sub></th>
  <th>C<sub>pe</sub>(A)</th><th>w<sub>e</sub> kPa</th><th>net, C<sub>pi</sub>=+0.2</th><th>net, C<sub>pi</sub>=−0.3</th></tr></thead>`;

/* ---------- sidebar ---------- */

function fld(path, label, opts = {}) {
  const v = path.split('.').reduce((o, k) => o[k], S);
  const id = 'f_' + path.replace(/\./g, '_');
  if (opts.options) {
    return `<div class="f ${opts.wide ? 'wide' : ''}"><label for="${id}">${label}</label>
      <select id="${id}" data-path="${path}">${opts.options.map(o =>
      `<option value="${esc(o[0])}"${String(o[0]) === String(v) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  }
  if (opts.text) {
    return `<div class="f wide"><label for="${id}">${label}</label>
      <input id="${id}" type="${opts.date ? 'date' : 'text'}" value="${esc(v)}" data-path="${path}"
      placeholder="${opts.ph || ''}"></div>`;
  }
  return `<div class="f"><label for="${id}">${label}${opts.unit ? ` <i>${opts.unit}</i>` : ''}</label>
    <input id="${id}" type="number" step="${opts.step || 'any'}" value="${v}" data-path="${path}" data-num="1"></div>`;
}

function buildingFields() {
  return `<div class="group"><h3>Building</h3>
    ${fld('preset', 'Preset', { wide: true, options: PRESETS })}
    <div class="pick">${ROOFS.map(([k, n]) =>
    `<button data-set="g.type" data-val="${k}" aria-pressed="${S.g.type === k}">${thumb(k)}${n}</button>`).join('')}</div>
    ${fld('g.h', 'Height h to highest point', { unit: 'm' })}
    ${fld('g.b', 'Width b — across wind at 0°', { unit: 'm' })}
    ${fld('g.d', 'Depth d — along wind at 0°', { unit: 'm' })}
    ${S.g.type !== 'flat' ? fld('g.alpha', 'Roof pitch α', { unit: '°' }) : ''}
    ${S.g.type === 'hip' ? fld('g.alpha90', 'Hip end pitch α₉₀', { unit: '°' }) : ''}
    ${S.g.type === 'flat' ? fld('edge.type', 'Eaves detail', {
      wide: true, options: [['sharp', 'Sharp eaves'], ['parapet', 'With parapet'], ['curved', 'Curved eaves'], ['mansard', 'Mansard eaves']]
    }) : ''}
    ${S.g.type === 'flat' && S.edge.type === 'parapet' ? fld('edge.hp', 'Parapet height h<sub>p</sub>', { unit: 'm' }) : ''}
    ${S.g.type === 'flat' && S.edge.type === 'curved' ? fld('edge.r', 'Eaves radius r', { unit: 'm' }) : ''}
    ${S.g.type === 'flat' && S.edge.type === 'mansard' ? fld('edge.mansard', 'Mansard angle α', { unit: '°' }) : ''}
    ${fld('g.A', 'Loaded area A of the element', { unit: 'm²' })}
    <p class="hint">A ≤ 1 m² uses C<sub>pe,1</sub>, A ≥ 10 m² uses C<sub>pe,10</sub>, between the two it is interpolated on log A (Figure 5).</p>
  </div>`;
}

function cpiFields() {
  return `<div class="group"><h3>Internal pressure used</h3>
    ${fld('cpiMode', 'Case', { wide: true, options: CPI_MODES.map(m => [m[0], m[1].replace('__pi__', 'pi')]) })}

    ${fld('cpiNeg', 'C<sub>pi</sub> negative case')}
    <p class="hint">Defaults are the +0.2 / −0.3 pair of cl 8.3.9.6 note 2. Work out site-specific values on the internal pressure tab.</p>
  </div>`;
}

    ${fld('altitude', 'Site altitude above sea level', { unit: 'm' })}
    ${fld('terrain', 'Terrain category', {

    <p class="hint">${TERRAIN[S.terrain].desc}</p>
    ${fld('useTopo', 'Topography', { wide: true, options: [[false, 'c₀ entered directly'], [true, 'Calculate from Annex B.3']] })}

      ${fld('topo.Lu', 'Upwind slope length L<sub>u</sub>', { unit: 'm' })}
      ${fld('topo.Ld', 'Downwind slope length L<sub>d</sub>', { unit: 'm' })}
      ${fld('topo.x', 'Distance from crest x', { unit: 'm' })}
      ${fld('topo.z', 'Height above local ground z', { unit: 'm' })}`}
  </div>`;

  if (['site', 'walls', 'roof', 'internal', 'friction', 'report'].includes(S.tab)) h += buildingFields();

  if (S.tab === 'site') h += `<div class="group"><h3>Reference heights</h3>${fld('g.hStrip', 'Strip height when h > 2b', { unit: 'm' })}</div>`;

  if (S.tab === 'report') {
    h += `<div class="group"><h3>Report title block</h3>
      ${fld('doc.project', 'Project', { text: true, ph: 'Project name' })}
      ${fld('doc.client', 'Client', { text: true })}
      ${fld('doc.structure', 'Structure', { text: true, ph: 'e.g. Warehouse A' })}
      ${fld('doc.job', 'Job number', { text: true })}
      ${fld('doc.by', 'Prepared by', { text: true })}
      ${fld('doc.checked', 'Checked by', { text: true })}
      ${fld('doc.rev', 'Revision', { text: true })}
      ${fld('doc.date', 'Date', { text: true, date: true })}
      ${fld('doc.incCanopy', 'Include canopy appendix', { wide: true, options: [[false, 'No'], [true, 'Yes']] })}
      ${fld('doc.incFree', 'Include free-standing appendix', { wide: true, options: [[false, 'No'], [true, 'Yes']] })}
    </div>`;
  }
  if (S.tab === 'internal') {
    h += `<div class="group"><h3>Faces and openings</h3>`;
    ['Face 1 — windward at 0°', 'Face 2 — at 90°', 'Face 3 — at 180°', 'Face 4 — at 270°'].forEach((n, i) => {
      h += `<p class="hint" style="margin:8px 0 2px;color:var(--muted)"><b>${n}</b></p>
        ${fld(`op.area.${i}`, 'Total area of face', { unit: 'm²' })}
        ${fld(`op.open.${i}`, 'Area of openings', { unit: 'm²' })}`;

    h += `</div>`;
  }
  if (S.tab === 'canopy') {
    h += `<div class="group"><h3>Canopy</h3>
      <div class="pick">${[['mono', 'Mono-pitch'], ['duo', 'Duo-pitch']].map(([k, n]) =>
      `<button data-set="can.kind" data-val="${k}" aria-pressed="${S.can.kind === k}">${canopyThumb(k)}${n}</button>`).join('')}</div>
      ${fld('can.h', 'Height h to highest point', { unit: 'm' })}
      ${fld('can.b', 'Width b across wind', { unit: 'm' })}
      ${fld('can.d', 'Depth d along wind', { unit: 'm' })}
      ${fld('can.alpha', 'Roof pitch α', { unit: '°' })}
      ${fld('can.phi', 'Degree of blockage φ')}
      <p class="hint">φ = 0 is a clear space under the canopy, φ = 1 is fully blocked at the downwind eaves (cl 8.4.2). Values between the two are interpolated.</p>
    </div>`;
  }
  if (S.tab === 'free') {
    h += `<div class="group"><h3>Element</h3>

    if (S.fw.mode === 'sign') {
      h += `${fld('fw.sh', 'Signboard height h', { unit: 'm' })}
        ${fld('fw.sb', 'Signboard width b', { unit: 'm' })}
        ${fld('fw.shg', 'Height of lower edge above ground', { unit: 'm' })}`;
    } else {
      h += `${fld('fw.h', S.fw.mode === 'parapet' ? 'Parapet height h<sub>p</sub>' : 'Wall height h', { unit: 'm' })}
        ${S.fw.mode === 'parapet' ? fld('fw.hb', 'Building height to parapet base', { unit: 'm' }) : ''}
        ${fld('fw.L', 'Length L', { unit: 'm' })}
        ${fld('fw.Lc', 'Return corner length', { unit: 'm' })}
        ${fld('fw.phi', 'Solidity ratio φ')}
        <p class="hint">φ = 1 is a solid wall. At φ = 0.8 every zone takes c<sub>p,net</sub> = 1.2; between 0.8 and 1 the tool interpolates. Below φ = 0.8 treat the wall as a plane lattice (cl 8.5.1).</p>`;
    }
    h += `</div>`;
  }
  if (S.tab === 'friction') {
    h += `<div class="group"><h3>Surface</h3>
      ${fld('fric', 'Surface roughness', {
      wide: true, options: [['smooth', 'Smooth — steel, smooth concrete (0.01)'],
      ['rough', 'Rough — rough concrete, tar boards (0.02)'], ['veryRough', 'Very rough — ripples, ribs, folds (0.04)']]
    })}</div>`;
  }
  return h;
}

/* ---------- results panes ---------- */

function paneSite() {
  const st = site(), t = TERRAIN[S.terrain], q = st.at(S.g.h);
  const topo = S.useTopo === true || S.useTopo === 'true'
    ? topographyFactor({ shape: S.topo.shape, H: +S.topo.H, Lu: +S.topo.Lu, Ld: +S.topo.Ld, x: +S.topo.x, z: +S.topo.z })
    : null;
  const parts = referenceHeights(S.g.h, S.g.b, S.g.hStrip);

  // ---- q_p profile chart ----
  const Hz = Math.max(S.g.h, 0.1);
  const prof = [];
  for (let i = 0; i <= 80; i++) { const z = Hz * i / 80; prof.push([st.at(z).qp, z]); }
  const niceStep = v => {
    const raw = Math.abs(v) / 5 || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  };
  const qPeak = Math.max(...prof.map(p => p[0]));
  const qStep = niceStep(qPeak);
  const qMax = Math.max(Math.ceil(qPeak / qStep) * qStep, qStep);
  const zStep = niceStep(Hz);
  const CW = 500, CH = 260, mL = 54, mR = 20, mT = 18, mB = 44;
  const X = q => mL + (q / qMax) * (CW - mL - mR);
  const Y = z => CH - mB - (z / Hz) * (CH - mB - mT);
  const qTicks = [], zTicks = [];
  for (let q = 0; q <= qMax + 1e-9; q += qStep) qTicks.push(q);
  for (let z = 0; z <= Hz + 1e-9; z += zStep) zTicks.push(z);
  const dp = qStep < 0.1 ? 3 : 2;

  const grid = qTicks.map(q => `<line x1="${X(q).toFixed(1)}" y1="${mT}" x2="${X(q).toFixed(1)}" y2="${CH - mB}" stroke="#e7edf2"/>`).join('')
    + zTicks.map(z => `<line x1="${mL}" y1="${Y(z).toFixed(1)}" x2="${CW - mR}" y2="${Y(z).toFixed(1)}" stroke="#e7edf2"/>`).join('');
  const curve = prof.map(([q, z], i) => `${i ? 'L' : 'M'}${X(q).toFixed(1)},${Y(z).toFixed(1)}`).join('');
  const area = `M${X(0).toFixed(1)},${Y(0).toFixed(1)}` + prof.map(([q, z]) => `L${X(q).toFixed(1)},${Y(z).toFixed(1)}`).join('') + `L${X(0).toFixed(1)},${Y(Hz).toFixed(1)}Z`;
  const marks = parts.length <= 6 ? parts : [parts[parts.length - 1]];
  const refLines = marks.map(p => {
    const q = st.at(p.ze).qp;
    return `<line x1="${mL}" y1="${Y(p.ze).toFixed(1)}" x2="${X(q).toFixed(1)}" y2="${Y(p.ze).toFixed(1)}"
      stroke="#e8871c" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="${X(q).toFixed(1)}" cy="${Y(p.ze).toFixed(1)}" r="2.6" fill="#e8871c"/>`;
  }).join('');
  const qTop = st.at(Hz).qp;
  const chart = `<svg viewBox="0 0 ${CW} ${CH}" class="chart">
    ${grid}
    <path d="${area}" fill="#0e3763" opacity=".07"/>
    <path d="${curve}" fill="none" stroke="#0e3763" stroke-width="2" stroke-linejoin="round"/>
    ${refLines}
    <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${CH - mB}" stroke="#aab8c4"/>
    <line x1="${mL}" y1="${CH - mB}" x2="${CW - mR}" y2="${CH - mB}" stroke="#aab8c4"/>
    ${qTicks.map(q => `<text x="${X(q).toFixed(1)}" y="${CH - mB + 15}" text-anchor="middle" font-size="10.5" fill="#5d6f80">${fmt(q, dp)}</text>`).join('')}
    ${zTicks.map(z => `<text x="${mL - 7}" y="${(Y(z) + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#5d6f80">${fmt(z, zStep < 1 ? 1 : 0)}</text>`).join('')}
    <text x="16" y="${((mT + CH - mB) / 2).toFixed(1)}" text-anchor="middle" font-size="11" fill="#5d6f80"
      transform="rotate(-90 16 ${((mT + CH - mB) / 2).toFixed(1)})">height z, m</text>
    <text x="${((mL + CW - mR) / 2).toFixed(1)}" y="${CH - 8}" text-anchor="middle" font-size="11" fill="#5d6f80">peak wind speed pressure, kPa</text>
  </svg>`;

  return `<h2>Peak wind speed pressure</h2>
  <p class="lede">Everything downstream scales with q<sub>p</sub>. The chain below follows clauses 7.2 to 7.4 for the reference height z<sub>e</sub> = h.</p>
  <div class="cards">
    <div class="card"><b>${fmt(st.vb, 1)}</b><span>v<sub>b</sub> basic wind speed, m/s</span></div>
    <div class="card"><b>${fmt(q.vp, 1)}</b><span>v<sub>p</sub>(z<sub>e</sub>) peak wind speed, m/s</span></div>
    <div class="card"><b>${fmt(q.qp, 3)}</b><span>q<sub>p</sub>(z<sub>e</sub>) peak pressure, kPa</span></div>
  </div>
  <h3>Calculation trail</h3>
  <div class="trail">
    <div><span>Fundamental basic wind speed v<sub>b,0</sub><em>Figure 1, 3 s gust</em></span><b>${fmt(S.vb0, 1)} m/s</b></div>
    <div><span>Probability factor c<sub>prob</sub> for a ${fmt(S.T, 0)} year return period<em>cl 7.2.3 eq 2, K = 0.2, n = 0.5</em></span><b>${fmt(st.cprob, 4)}</b></div>
    <div class="key"><span>Basic wind speed v<sub>b</sub> = c<sub>prob</sub> · v<sub>b,0</sub><em>cl 7.2.2 eq 1</em></span><b>${fmt(st.vb, 2)} m/s</b></div>
    <div><span>Terrain ${S.terrain}: z<sub>g</sub> = ${t.zg} m, z<sub>0</sub> = ${t.z0} m, z<sub>c</sub> = ${t.zc} m, α = ${t.a}<em>cl 7.3.2.1 Table 1</em></span><b></b></div>
    <div><span>Roughness factor c<sub>r</sub>(z<sub>e</sub>) = 1.36 ((z − z<sub>0</sub>)/z<sub>g</sub>)<sup>α</sup><em>cl 7.3.2.1 eq 5</em></span><b>${fmt(q.cr, 4)}</b></div>
    <div><span>Topography factor c<sub>0</sub>(z<sub>e</sub>)<em>cl 7.3.3, Annex B.3</em></span><b>${fmt(S.c0, 3)}</b></div>
    <div class="key"><span>Peak wind speed v<sub>p</sub> = c<sub>r</sub> · c<sub>0</sub> · v<sub>b,peak</sub><em>cl 7.3.1.1 eq 3</em></span><b>${fmt(q.vp, 2)} m/s</b></div>
    <div><span>Air density ρ at ${fmt(S.altitude, 0)} m above sea level<em>Table 4</em></span><b>${fmt(st.rho, 3)} kg/m³</b></div>
    <div class="key"><span>Peak wind speed pressure q<sub>p</sub> = ½ ρ v<sub>p</sub>²<em>cl 7.4 eq 6</em></span><b>${fmt(q.qp, 4)} kPa</b></div>
  </div>
  ${topo ? `<h3>Topography, Annex B.3</h3>
    <div class="trail">
      <div><span>Upwind slope Φ = H / L<sub>u</sub></span><b>${fmt(topo.phi, 3)}</b></div>
      <div><span>Effective length L<sub>e</sub></span><b>${fmt(topo.Le, 1)} m</b></div>
      <div><span>Orography factor s<em>Figure B.2</em></span><b>${fmt(topo.s, 3)}</b></div>
      <div class="key"><span>c<sub>0</sub> = 1 + 2 s Φ</span><b>${fmt(topo.c0, 3)}</b></div>
    </div>
    ${topo.note ? `<div class="note">${topo.note}</div>` : ''}
    <div class="note">Calculated c₀ = <b>${fmt(topo.c0, 3)}</b>. It is not applied automatically — switch topography back to "entered directly" and type it in if you want to use it.</div>` : ''}
  <h3>Pressure over the height of the structure</h3>
  <div class="figs"><div class="fig" style="flex:1 1 470px">
    <h4>q<sub>p</sub> against height</h4>
    <div class="cap">Terrain ${S.terrain}, c₀ = ${fmt(S.c0, 2)} — constant below z<sub>c</sub> = ${TERRAIN[S.terrain].zc} m.
      Marker shows q<sub>p</sub> = ${fmt(qTop, 4)} kPa at z<sub>e</sub> = ${fmt(Hz, 2)} m.</div>
    ${chart}</div>
    <div class="fig" style="flex:1 1 320px"><h4>Reference heights</h4>
      <div class="cap">cl 8.3.2.1, Figure 7 — h = ${fmt(S.g.h, 2)} m, b = ${fmt(S.g.b, 2)} m</div>
      <table><thead><tr><th>Part</th><th>from, m</th><th>to, m</th><th>z<sub>e</sub>, m</th><th>q<sub>p</sub>, kPa</th></tr></thead><tbody>
      ${parts.map((p, i) => `<tr><td>${i + 1}</td><td>${fmt(p.zBot, 2)}</td><td>${fmt(p.zTop, 2)}</td>
        <td>${fmt(p.ze, 2)}</td><td>${fmt(st.at(p.ze).qp, 4)}</td></tr>`).join('')}
      </tbody></table>
      <p class="ref">${parts.length === 1 ? 'h ≤ b, so the structure is treated as one part.'
      : parts.length === 2 ? 'b &lt; h ≤ 2b, so the structure is split into two parts.'
        : 'h &gt; 2b, so the middle of the structure is divided into strips.'}</p>
    </div>
  </div>`;
}

function paneWalls() {
  const q = qpRef(), g = S.g;
  const a = wallP('0'), b90 = wallP('90');
  const sc0 = buildingScene(g, '0', a.p, null);
  const sc90 = buildingScene(g, '90', b90.p, null);
  const tbl = (w, dir) => `<table>${COEFF_HEAD}<tbody>${coeffRows(w.cpe, q, ['A', 'B', 'C', 'D', 'E'])}</tbody></table>
    <p class="ref">e = min(b, 2h) = ${fmt(w.e, 3)} m &nbsp;·&nbsp; h/d = ${fmt(w.hd, 3)}
    &nbsp;·&nbsp; ${w.zones.map(z => `${z.id}: ${fmt(z.x1 - z.x0, 2)} m`).join(' · ')}</p>`;
  const F = (dir, w) => {
    const cd = w.cpe.D.cpe, ce = w.cpe.E.cpe;
    const area = dir === '0' ? g.b * g.h : g.d * g.h;
    return (cd - ce) * w.corr * q * area;
  };
  return `<h2>Vertical walls</h2>
  <p class="lede">External pressure coefficients for the walls of a rectangular building, cl 8.3.2 and Table 6. Zones A to C run back from the windward corner along each side wall; D is windward and E leeward.</p>
  ${figs([{ t: 'Wind at 0°', c: 'Zones A, B, C run back from the windward corner; D windward, E leeward', scene: sc0, w: '0' },
           { t: 'Wind at 90°', c: 'b and d swap over, so e is measured on the new crosswind width', scene: sc90, w: '90' }])}
  <h3>Wind at 0°</h3>${tbl(a.w, '0')}
  <h3>Wind at 90°</h3>${tbl(b90.w, '90')}
  <h3>Overall horizontal force on the walls</h3>
  <table><thead><tr><th>Direction</th><th>C<sub>pe,D</sub></th><th>C<sub>pe,E</sub></th><th>Correlation factor</th><th>Reference area, m²</th><th>F<sub>w</sub>, kN</th></tr></thead><tbody>
    <tr><td class="z">0°</td><td>${fmt(a.w.cpe.D.cpe)}</td><td>${fmt(a.w.cpe.E.cpe)}</td><td>${fmt(a.w.corr, 2)}</td><td>${fmt(S.g.b * S.g.h, 1)}</td><td>${fmt(F('0', a.w), 1)}</td></tr>
    <tr><td class="z">90°</td><td>${fmt(b90.w.cpe.D.cpe)}</td><td>${fmt(b90.w.cpe.E.cpe)}</td><td>${fmt(b90.w.corr, 2)}</td><td>${fmt(S.g.d * S.g.h, 1)}</td><td>${fmt(F('90', b90.w), 1)}</td></tr>
  </tbody></table>
  <div class="note">The correlation factor of cl 8.3.2.4 accounts for windward and leeward peaks not happening at the same instant: 0.85 for h/d ≤ 1, rising linearly to 1.0 at h/d ≥ 5. It applies to the <b>overall force</b> only, not to the zone pressures in the tables above. The force here excludes the structural factor c<sub>s</sub>c<sub>d</sub> and any friction.</div>`;
}

function paneRoof() {
  const q = qpRef(), g = S.g, c = roofCoeffs();
  const wp0 = wallP('0').p, wp90 = wallP('90').p;
  const V = o => { const m = {}; Object.keys(o).forEach(k => m[k] = o[k].cpe * q); return m; };
  let figList = [], tabs = '';
  const T = (title, obj, cap) => `<h3>${title}</h3>${cap ? `<p class="ref">${cap}</p>` : ''}
    <table>${COEFF_HEAD}<tbody>${coeffRows(obj, q)}</tbody></table>`;

  if (g.type === 'flat') {
    const z = flatRoofZones(g.h, g.b, g.d), z90 = flatRoofZones(g.h, g.d, g.b);
    const p = V(c.flat);
    figList = [{ t: 'Wind at 0°', c: 'Zones F, G, H, I measured back from the windward eaves', scene: buildingScene(g, '0', wp0, p), w: '0' },
               { t: 'Wind at 90°', c: 'The same zoning rotated through 90°', scene: buildingScene(g, '90', wp90, p), w: '90' }];
    tabs = T('Coefficients — both directions', c.flat, `e = ${fmt(z.e, 2)} m · F width ${fmt(z.F.widthEach, 2)} m · F, G depth ${fmt(z.F.depth, 2)} m · H depth ${fmt(z.H.depth, 2)} m · I depth ${fmt(z.I.depth, 2)} m`)
      + `<div class="note">Zone I carries <b>both</b> signs: ${fmt(c.flat.I.cpe, 2)} and +${fmt(c.flat.I.cpePos, 2)}. Both cases must be checked.</div>`;
  } else if (g.type === 'mono') {
    const z = monoZones(g.h, g.b, g.d);
    figList = [{ t: 'Wind at 0° — onto the low eaves', c: 'Suction case, Table 8', scene: buildingScene(g, '0', wp0, V(c.deg0neg)), w: '0' },
               { t: 'Wind at 180° — onto the high eaves', c: 'Table 8', scene: buildingScene(g, '180', null, V(c.deg180)), w: '180' },
               { t: 'Wind at 90°', c: 'F splits into F<sub>up</sub> at the high eaves and F<sub>low</sub> at the low eaves', scene: buildingScene(g, '90', wp90, V(c.deg90)), w: '90' }];
    tabs = T('Wind at 0° — suction case', c.deg0neg, `e = ${fmt(z.e, 2)} m · F width ${fmt(z.d0.F.widthEach, 2)} m · F, G depth ${fmt(z.d0.F.depth, 2)} m · H depth ${fmt(z.d0.H.depth, 2)} m`)
      + T('Wind at 0° — pressure case', c.deg0pos, 'Table 8 gives a second, positive set for pitches above 5°. Check both.')
      + T('Wind at 180°', c.deg180)
      + T('Wind at 90°', c.deg90);
  } else if (g.type === 'duo') {
    const z = duoZones(g.h, g.b, g.d);
    figList = [{ t: 'Wind at 0° — suction case', c: 'Zone J is the strip just leeward of the ridge', scene: buildingScene(g, '0', wp0, V(c.deg0neg)), w: '0' },
               { t: 'Wind at 90°', c: 'Wind along the ridge', scene: buildingScene(g, '90', wp90, V(c.deg90)), w: '90' }];
    tabs = T('Wind at 0° — case 1', c.deg0neg, `e = ${fmt(z.e, 2)} m · F width ${fmt(z.d0.F.widthEach, 2)} m · F, G depth ${fmt(z.d0.F.depth, 2)} m · H depth ${fmt(z.d0.H.depth, 2)} m · J depth ${fmt(z.d0.J.depth, 2)} m`)
      + T('Wind at 0° — case 2', c.deg0pos, 'Table 10 lists two sets for pitches between −5° and +45°. Neither may be mixed with the other.')
      + T('Wind at 90°', c.deg90, `F width ${fmt(z.d90.F.widthEach, 2)} m · G width ${fmt(z.d90.G.width, 2)} m · H depth ${fmt(z.d90.H.depth, 2)} m`);
  } else {
    figList = [{ t: 'Wind at 0°', c: 'Zone boundaries indicative — confirm against Figure 12', scene: buildingScene(g, '0', wp0, V(c.deg0)), w: '0' },
               { t: 'Wind at 90°', c: 'Onto the hip end', scene: buildingScene(g, '90', wp90, V(c.deg90)), w: '90' }];
    tabs = T('Wind at 0° — case 1', c.deg0)
      + T('Wind at 0° — case 2', c.deg0pos, 'Positive set for the windward slope.')
      + T('Wind at 90°', c.deg90)
      + `<div class="note">Zone K is listed in the table but not drawn — it is a small region at the head of the windward hip. Read the zone boundaries off Figure 12 of the code.</div>`;
  }
  // resultant forces on the envelope
  const rv0 = g.type === 'flat' ? V(c.flat) : g.type === 'mono' ? V(c.deg0neg)
    : g.type === 'duo' ? V(c.deg0neg) : V(c.deg0);
  const rv90 = g.type === 'flat' ? V(c.flat) : V(c.deg90);
  const ef0 = envelopeForces(g, '0', wp0, rv0, q, S.cpiPos, S.cpiNeg);
  const ef90 = envelopeForces(g, '90', wp90, rv90, q, S.cpiPos, S.cpiNeg);
  const fRow = (n, e) => `<tr><td class="z">${n}</td>
    <td>${fmt(e.cpi, 2)}</td><td>${fmt(e.areaRoof, 1)}</td>
    <td class="${e.roofVert > 0 ? 'neg' : 'pos'}">${fmt(e.roofVert, 1)}</td>
    <td>${fmt(e.roofAlong, 1)}</td><td>${fmt(e.wallAlong, 1)}</td>
    <td><b>${fmt(e.totalAlong, 1)}</b></td></tr>`;
  const forces = `<h3>Resultant forces on the envelope</h3>
  <p class="ref">Each zone pressure is resolved on its own surface and summed, so pitched roofs keep the
  correct vertical and horizontal split. Positive vertical is <b>uplift</b>. Internal pressure is included.</p>
  <table><thead><tr><th>Wind / case</th><th>C<sub>pi</sub></th><th>Roof area, m²</th>
    <th>Roof vertical, kN</th><th>Roof along wind, kN</th><th>Walls along wind, kN</th>
    <th>Total along wind, kN</th></tr></thead><tbody>
    ${fRow('0°, C<sub>pi</sub> positive', ef0.pos)}${fRow('0°, C<sub>pi</sub> negative', ef0.neg)}
    ${fRow('90°, C<sub>pi</sub> positive', ef90.pos)}${fRow('90°, C<sub>pi</sub> negative', ef90.neg)}
  </tbody></table>
  <div class="note">Governing roof uplift is
    <b>${fmt(Math.max(ef0.pos.roofVert, ef0.neg.roofVert, ef90.pos.roofVert, ef90.neg.roofVert), 1)} kN</b>
    over ${fmt(ef0.pos.areaRoof, 1)} m² of roof. Use it against the permanent load for holding-down design.
    Friction from the friction tab is additional to the along-wind totals, and the structural factor
    c<sub>s</sub>c<sub>d</sub> is not included.</div>`;

  const keyFig = `<h3>Zone key</h3>
  <p class="ref">Plan on the roof, set out from the same clipped geometry as the 3D views.</p>
  <div class="figs">
    <div class="fig" style="flex:1 1 380px"><h4>Wind at 0°</h4>
      <div class="cap">${{ flat: 'Figure 8', mono: 'Figure 9', duo: 'Figure 11', hip: 'Figure 12' }[g.type]} · zone layout</div>
      ${renderZoneKey(g, '0', rv0, { width: 430, height: 300 })}</div>
    <div class="fig" style="flex:1 1 380px"><h4>Wind at 90°</h4>
      <div class="cap">${{ flat: 'Figure 8', mono: 'Figure 9', duo: 'Figure 11', hip: 'Figure 12' }[g.type]} · zone layout</div>
      ${renderZoneKey(g, '90', rv90, { width: 430, height: 300 })}</div>
  </div>`;

  return `<h2>${ROOFS.find(r => r[0] === g.type)[1]} roof</h2>
    <p class="lede">External pressure coefficients from ${{ flat: 'Table 7', mono: 'Tables 8 and 9', duo: 'Tables 10 and 11', hip: 'Table 12' }[g.type]}, interpolated on ${g.type === 'flat' ? 'the eaves detail' : 'the roof pitch'} and on the loaded area A = ${fmt(g.A, 1)} m².</p>
    ${figs(figList)}${tabs}
    ${keyFig}${forces}
    <div class="note">Vaulted and domed roofs (cl 8.3.8) are not covered by this tool.</div>`;
}

function paneInternal() {
  const g = S.g, q = qpRef();
  const hd = [g.h / g.d, g.h / g.b, g.h / g.d, g.h / g.b];
  const w0 = wallZones(g.h, g.b, g.d, 10).cpe, w90 = wallZones(g.h, g.d, g.b, 10).cpe;
  const avg = w => (w.A.cpe10 * 0.2 + w.B.cpe10 * 0.8);   // weighted side-wall value
  const side0 = avg(w0), side90 = avg(w90);
  const faceCpe = [
    [w0.D.cpe10, side90, w0.E.cpe10, side90],
    [side0, w90.D.cpe10, side0, w90.E.cpe10],
    [w0.E.cpe10, side90, w0.D.cpe10, side90],
    [side0, w90.E.cpe10, side0, w90.D.cpe10]
  ];
  const faces = [0, 1, 2, 3].map(i => ({
    area: +S.op.area[i], openArea: +S.op.open[i], cpe: faceCpe[i]
  }));
  const res = internalPressure(faces, hd);
  const rows = res.map((r, i) => `<tr><td class="z">${r.dir}°</td>
    <td>${r.mode === 'dominant' ? `face ${r.face}, ratio ${fmt(r.ratio, 1)}` : r.mode === 'mu' ? `μ = ${fmt(r.mu, 3)}` : 'no openings'}</td>
    <td>${r.mode === 'dominant' ? `${fmt(r.factor, 2)} · C<sub>pe</sub>` : r.mode === 'mu' ? `${fmt(r.upper, 3)} / ${fmt(r.lower, 3)}` : '–'}</td>
    <td class="${sgn(r.cpi)}">${fmt(r.cpi, 3)}</td>
    <td class="${sgn(r.cpi * q)}">${fmt(r.cpi === null ? null : r.cpi * q, 3)}</td></tr>`).join('');
  const anyDominant = res.some(r => r.mode === 'dominant');
  return `<h2>Internal pressure</h2>
  <p class="lede">cl 8.3.9. A face counts as dominant when its openings are at least twice the openings in all the other faces put together; otherwise C<sub>pi</sub> comes from the opening ratio μ and h/d on Figure 16.</p>
  <table><thead><tr><th>Wind</th><th>Governing condition</th><th>Figure 16, h/d ≤ 0.25 / ≥ 1</th><th>C<sub>pi</sub></th><th>w<sub>i</sub>, kPa</th></tr></thead><tbody>${rows}</tbody></table>
  <h3>Openings entered</h3>
  <table><thead><tr><th>Face</th><th>Area, m²</th><th>Openings, m²</th><th>Ratio</th><th>Check</th></tr></thead><tbody>
    ${faces.map((f, i) => `<tr><td class="z">${i + 1}</td><td>${fmt(f.area, 1)}</td><td>${fmt(f.openArea, 1)}</td>
      <td>${fmt(f.area > 0 ? f.openArea / f.area : 0, 3)}</td>
      <td>${f.openArea > 0.3 * f.area ? '<span class="neg">openings exceed 30% of the face — treat as a canopy, cl 8.4</span>' : '<span class="ok">within cl 8.3</span>'}</td></tr>`).join('')}
  </tbody></table>
  <div class="note">Where the openings cannot be estimated, cl 8.3.9.6 note 2 requires the more onerous of
    <b>C<sub>pi</sub> = +0.2</b> (w<sub>i</sub> = ${fmt(0.2 * q, 3)} kPa) and <b>−0.3</b> (${fmt(-0.3 * q, 3)} kPa).
    Open silos and chimneys take −0.6; vented tanks with small openings take −0.4 (cl 8.3.9.8).</div>
  ${anyDominant ? '' : `<div class="note">The Figure 16 curves here are digitised to about ±0.01. For a design that turns on C<sub>pi</sub>, read the figure in the code.</div>`}
  <div class="note">External coefficients at the openings are taken as area-weighted values over zones A and B of each face. Where the openings sit in one zone, substitute that zone's C<sub>pe</sub> by hand (cl 8.3.9.5).</div>`;
}

function paneCanopy() {
  const c = S.can, q = qpAt(c.h);
  const r = c.kind === 'mono' ? canopyMono(+c.alpha, +c.phi, 10) : canopyDuo(+c.alpha, +c.phi);
  const zones = Object.keys(r.zones);
  const maxV = {}, minV = {};
  zones.forEach(k => { maxV[k] = r.zones[k].max * q; minV[k] = r.zones[k].min * q; });
  const gg = { h: +c.h, b: +c.b, d: +c.d, alpha: +c.alpha };
  const scMin = canopyScene(c.kind, gg, minV);
  const scMax = canopyScene(c.kind, gg, maxV);
  const area = c.b * c.d / Math.cos(c.alpha * Math.PI / 180);
  return `<h2>${c.kind === 'mono' ? 'Mono' : 'Duo'}-pitch canopy roof</h2>
  <p class="lede">cl 8.4 and ${c.kind === 'mono' ? 'Table 13' : 'Table 14'}. Canopy coefficients are <b>net</b> — they already combine the pressure on the top and the underside, so they are not combined with C<sub>pi</sub>.</p>
  ${figs([{ t: 'Maximum uplift', c: 'Largest negative c<sub>p,net</sub>, φ = ' + fmt(c.phi, 2), scene: scMin, w: '0' },
           { t: 'Maximum downward pressure', c: 'Largest positive c<sub>p,net</sub>', scene: scMax, w: '0' }])}
  <h3>Net pressure coefficients</h3>
  <table><thead><tr><th>Zone</th><th>c<sub>p,net</sub> max</th><th>c<sub>p,net</sub> min</th><th>w max, kPa</th><th>w min, kPa</th></tr></thead><tbody>
  ${zones.map(k => `<tr><td class="z"><span class="sw" style="background:${pressureColour(minV[k], 1, 1)}"></span>${k}</td>
    <td>${fmt(r.zones[k].max)}</td><td>${fmt(r.zones[k].min)}</td>
    <td class="pos">${fmt(maxV[k], 3)}</td><td class="neg">${fmt(minV[k], 3)}</td></tr>`).join('')}
  </tbody></table>
  <h3>Overall force on the structure</h3>
  <table><thead><tr><th>Case</th><th>c<sub>f</sub></th><th>q<sub>p</sub>, kPa</th><th>Reference area, m²</th><th>F<sub>w</sub>, kN</th></tr></thead><tbody>
    <tr><td class="z">Downward</td><td>${fmt(r.cf.max)}</td><td>${fmt(q, 4)}</td><td>${fmt(area, 1)}</td><td class="pos">${fmt(r.cf.max * q * area, 1)}</td></tr>
    <tr><td class="z">Uplift</td><td>${fmt(r.cf.min)}</td><td>${fmt(q, 4)}</td><td>${fmt(area, 1)}</td><td class="neg">${fmt(r.cf.min * q * area, 1)}</td></tr>
  </tbody></table>
  <div class="note">Use c<sub>f</sub> with the centre of pressure at <b>d/4 = ${fmt(c.d / 4, 2)} m</b> from the windward edge for the overall design of the structure; use the zone values for roofing elements and their fixings (cl 8.4.5). A duo-pitch canopy must also be checked with one slope loaded and the other unloaded. Zone boundaries in the views are indicative — set them out from Figure ${c.kind === 'mono' ? '19' : '20'}. Strip widths are b/10 = ${fmt(c.b / 10, 2)} m and d/10 = ${fmt(c.d / 10, 2)} m.</div>`;
}

function paneFree() {
  const f = S.fw;
  if (f.mode === 'sign') {
    const sb = signboard(+f.sh, +f.sb, +f.shg);
    const q = qpAt(sb.ze), F = sb.cf * q * sb.Aref;
    const sc = plateScene([{ id: 'A', x0: 0, x1: +f.sb }], { A: sb.cf * q }, +f.sh, +f.sb, Math.min(f.sb, f.sh) * 0.06, +f.shg, true);
    return `<h2>Signboard</h2>
    <p class="lede">cl 8.5.3. A signboard separated from the ground by at least h/4 takes a force coefficient of 1.8, applied at mid-height with a horizontal eccentricity of ±b/4.</p>
    ${figs([{ t: 'Net pressure on the board', c: `z<sub>e</sub> = ${fmt(sb.ze, 2)} m, c<sub>f</sub> = 1.8`, scene: sc, w: '0' }])}
    ${sb.applies ? '' : '<div class="note warn">The lower edge is less than h/4 above the ground, so cl 8.5.3 does not apply — treat the board as a free-standing wall instead.</div>'}
    <div class="trail">
      <div><span>Reference height z<sub>e</sub> = h<sub>g</sub> + h/2</span><b>${fmt(sb.ze, 2)} m</b></div>
      <div><span>q<sub>p</sub>(z<sub>e</sub>)</span><b>${fmt(q, 4)} kPa</b></div>
      <div><span>Reference area A<sub>ref</sub> = b · h</span><b>${fmt(sb.Aref, 1)} m²</b></div>
      <div><span>Force coefficient c<sub>f</sub></span><b>${fmt(sb.cf, 1)}</b></div>
      <div class="key"><span>Resultant force F<sub>w</sub> = c<sub>f</sub> q<sub>p</sub> A<sub>ref</sub></span><b>${fmt(F, 1)} kN</b></div>
      <div><span>Horizontal eccentricity e = ± b/4</span><b>± ${fmt(sb.ecc, 2)} m</b></div>
      <div><span>Torsional moment F<sub>w</sub> · e</span><b>± ${fmt(F * sb.ecc, 1)} kNm</b></div>
      <div class="key"><span>Moment at ground level F<sub>w</sub> · z<sub>e</sub></span><b>${fmt(F * sb.ze, 1)} kNm</b></div>
    </div>
    <div class="note">Divergence and flutter must be checked separately for slender boards (cl 8.5.3 note).</div>`;
  }
  const h = +f.h, zRef = f.mode === 'parapet' ? +f.hb + h : h;
  const q = qpAt(zRef);
  const r = freeWall(h, +f.L, +f.Lc, +f.phi);
  const vals = {}; Object.keys(r.cpNet).forEach(k => vals[k] = r.cpNet[k] * q);
  const sc = plateScene(r.zones, vals, h, +f.L, Math.min(h, f.L) * 0.08, f.mode === 'parapet' ? +f.hb : 0, false);
  return `<h2>${f.mode === 'parapet' ? 'Parapet' : 'Free-standing wall'}</h2>
  <p class="lede">cl 8.5.1 and Table 16. Zones are set out from the windward free end: A over 0.3h, B to 2h, C to 4h and D beyond. c<sub>p,net</sub> is a net coefficient across the wall.</p>
  ${figs([{ t: 'Net pressure', c: `L/h = ${fmt(r.Lh, 2)}, reference height z<sub>e</sub> = ${fmt(zRef, 2)} m`, scene: sc, w: '0' }])}
  <table><thead><tr><th>Zone</th><th>From, m</th><th>To, m</th><th>Solid, no corners</th><th>After corners</th><th>c<sub>p,net</sub></th><th>w, kPa</th></tr></thead><tbody>
  ${r.zones.map((z, i) => `<tr><td class="z"><span class="sw" style="background:${pressureColour(vals[z.id], 1, 1)}"></span>${z.id}</td>
    <td>${fmt(z.x0, 2)}</td><td>${fmt(z.x1, 2)}</td>
    <td>${fmt(r.noCorner[i])}</td><td>${fmt(r.solid[i])}</td>
    <td>${fmt(r.cpNet[z.id])}</td><td class="pos">${fmt(vals[z.id], 3)}</td></tr>`).join('')}
  </tbody></table>
  <div class="note">Return corners at least h long reduce zone A markedly; the tool interpolates linearly for shorter returns. Total force on the wall, taking each zone at its own coefficient:
    <b>${fmt(r.zones.reduce((s, z) => s + r.cpNet[z.id] * q * (z.x1 - z.x0) * h, 0), 1)} kN</b>.</div>`;
}

function paneFriction() {
  const g = S.g, q = qpRef(), cfr = FRICTION[S.fric];
  const f0 = frictionForce(g.h, g.b, g.d, cfr, q);
  const f90 = frictionForce(g.h, g.d, g.b, cfr, q);
  const row = (n, f, b, d) => `<tr><td class="z">${n}</td>
    <td>${fmt(f.start, 2)}</td><td>${fmt(f.Aroof, 1)}</td><td>${fmt(f.Awalls, 1)}</td><td>${fmt(f.Afr, 1)}</td>
    <td>${fmt(f.ratio, 2)}</td>
    <td>${f.ignorable ? '<span class="ok">may be ignored</span>' : '<span class="neg">must be included</span>'}</td>
    <td>${fmt(f.Ffr, 2)}</td></tr>`;
  return `<h2>Friction forces</h2>
  <p class="lede">cl 7.5.3.6 and 8.6. Friction acts on surfaces parallel to the wind, but only beyond min(2b, 4h) from the windward edge, and may be ignored altogether when the total area parallel to the wind is no more than four times the area normal to it.</p>
  <div class="cards">
    <div class="card"><b>${fmt(cfr, 2)}</b><span>c<sub>fr</sub>, Table 17</span></div>
    <div class="card"><b>${fmt(cfr * q, 4)}</b><span>w<sub>fr</sub> = c<sub>fr</sub> q<sub>p</sub>, kPa</span></div>
  </div>
  <table><thead><tr><th>Wind</th><th>Starts at, m</th><th>Roof area, m²</th><th>Wall area, m²</th><th>A<sub>fr</sub>, m²</th>
    <th>Parallel / normal</th><th>cl 7.5.3.6</th><th>F<sub>fr</sub>, kN</th></tr></thead><tbody>
    ${row('0°', f0)}${row('90°', f90)}
  </tbody></table>
  <div class="note">The friction force acts along the wind, added to the pressure forces from the walls. Where A<sub>fr</sub> works out at zero the building is too short along the wind for friction to develop.</div>`;
}

function paneReport() {
  const st = site(), q = qpRef(), g = S.g;
  const a = wallP('0').w, b90 = wallP('90').w, c = roofCoeffs();
  const roofTbl = () => {
    const sets = g.type === 'flat' ? [['Both directions', c.flat]]
      : g.type === 'mono' ? [['0° suction', c.deg0neg], ['0° pressure', c.deg0pos], ['180°', c.deg180], ['90°', c.deg90]]
        : g.type === 'duo' ? [['0° case 1', c.deg0neg], ['0° case 2', c.deg0pos], ['90°', c.deg90]]
          : [['0° case 1', c.deg0], ['0° case 2', c.deg0pos], ['90°', c.deg90]];
    return sets.map(([n, o]) => `<h3>Roof — ${n}</h3><table>${COEFF_HEAD}<tbody>${coeffRows(o, q)}</tbody></table>`).join('');
  };
  return `<h2>Summary</h2>
  <p class="lede">Everything the tool has worked out, on one page. The Word report is a formal
  document — title block, numbered sections and tables, clause references, page numbering and a
  statement of assumptions and limitations — ready to be edited and issued.</p>
  <div class="docbar">
    <button class="btn big" onclick="downloadDocx(this)">Download Word report (.docx)</button>
    <button class="btn ghost" onclick="saveProject()">Save project</button>
    <button class="btn ghost" onclick="document.getElementById('openFile').click()">Open project</button>
    <button class="btn ghost" onclick="window.print()">Print this page</button>
    <span>Fill in the title block on the left before downloading.</span>
  </div>
  <h3>Input</h3>
  <table><tbody>
    <tr><td>Site</td><td style="text-align:left">${esc(S.muni)}, ${esc(PROVINCES[S.province])}</td></tr>
    <tr><td>v<sub>b,0</sub> / return period / altitude</td><td style="text-align:left">${fmt(S.vb0, 1)} m/s · ${fmt(S.T, 0)} years · ${fmt(S.altitude, 0)} m</td></tr>
    <tr><td>Terrain category / c₀</td><td style="text-align:left">${S.terrain} · ${fmt(S.c0, 2)}</td></tr>
    <tr><td>Building h × b × d</td><td style="text-align:left">${fmt(g.h, 2)} × ${fmt(g.b, 2)} × ${fmt(g.d, 2)} m</td></tr>
    <tr><td>Roof</td><td style="text-align:left">${ROOFS.find(r => r[0] === g.type)[1]}${g.type !== 'flat' ? `, α = ${fmt(g.alpha, 1)}°` : ''}${g.type === 'hip' ? `, α₉₀ = ${fmt(g.alpha90, 1)}°` : ''}</td></tr>
    <tr><td>Loaded area A</td><td style="text-align:left">${fmt(g.A, 1)} m²</td></tr>
  </tbody></table>
  <h3>Peak wind speed pressure</h3>
  <table><tbody>
    <tr><td>c<sub>prob</sub></td><td>${fmt(st.cprob, 4)}</td><td>v<sub>b</sub></td><td>${fmt(st.vb, 2)} m/s</td></tr>
    <tr><td>c<sub>r</sub>(z<sub>e</sub>)</td><td>${fmt(st.at(g.h).cr, 4)}</td><td>v<sub>p</sub>(z<sub>e</sub>)</td><td>${fmt(st.at(g.h).vp, 2)} m/s</td></tr>
    <tr><td>ρ</td><td>${fmt(st.rho, 3)} kg/m³</td><td><b>q<sub>p</sub>(z<sub>e</sub>)</b></td><td><b>${fmt(q, 4)} kPa</b></td></tr>
  </tbody></table>
  <h3>Walls — wind at 0°</h3><table>${COEFF_HEAD}<tbody>${coeffRows(a.cpe, q, ['A', 'B', 'C', 'D', 'E'])}</tbody></table>
  <h3>Walls — wind at 90°</h3><table>${COEFF_HEAD}<tbody>${coeffRows(b90.cpe, q, ['A', 'B', 'C', 'D', 'E'])}</tbody></table>
  ${roofTbl()}
  <div class="note">Net pressures use C<sub>pi</sub> = +${fmt(S.cpiPos, 2)} and ${fmt(S.cpiNeg, 2)}.
  Pressure coefficients and the peak pressure are as SANS 10160-3:2018. Partial factors and load combinations are Part 1 and are not applied here.</div>`;
}

const PANES = {
  site: paneSite, walls: paneWalls, roof: paneRoof, internal: paneInternal,
  canopy: paneCanopy, free: paneFree, friction: paneFriction, report: paneReport
};

/* ---------- wiring ---------- */

function setPath(path, value) {
  const keys = path.split('.');
  let o = S;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
}

function renderHeader() {
  const st = site(), p = st.at(S.g.h);
  document.getElementById('liveVp').textContent = fmt(p.vp, 1);
  document.getElementById('liveQp').textContent = fmt(p.qp, 3);
}

function renderResults() {
  try {
    document.getElementById('out').innerHTML = PANES[S.tab]();
  } catch (e) {
    document.getElementById('out').innerHTML =
      `<h2>Check the input</h2><div class="note warn">The geometry entered does not produce a valid figure: ${esc(e.message)}</div>`;
  }
  renderHeader();
}

function renderSidebar() {
  document.getElementById('side').innerHTML = sidebar();
}

function renderAll() { renderSidebar(); renderResults(); }

function init() {
  document.getElementById('nav').innerHTML = TABS.map(([k, n]) =>
    `<button data-tab="${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');

  document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]'); if (!b) return;
    S.tab = b.dataset.tab;
    [...document.querySelectorAll('#nav button')].forEach(x => x.setAttribute('aria-selected', x.dataset.tab === S.tab));
    renderAll();
  });

  const side = document.getElementById('side');
  side.addEventListener('input', e => {
    const t = e.target; if (!t.dataset.path) return;
    setPath(t.dataset.path, t.dataset.num ? (t.value === '' ? 0 : +t.value) : t.value);
    if (t.dataset.path === 'province') {
      const first = MUNICIPALITIES.find(m => m[1] === +S.province);
      if (first) { S.muni = first[0]; S.vb0 = first[2]; }
      renderAll(); return;
    }
    if (t.dataset.path === 'muni') {
      const m = MUNICIPALITIES.find(x => x[0] === S.muni && x[1] === +S.province);
      if (m) S.vb0 = m[2];
      renderAll(); return;
    }
    if (t.dataset.path === 'preset') {
      const p = PRESET_G[S.preset];
      if (p) { Object.assign(S.g, p); S.edge.type = 'sharp'; }
      renderAll(); return;
    }
    if (t.dataset.path === 'cpiMode') {
      if (S.cpiMode === 'pair') { S.cpiPos = 0.2; S.cpiNeg = -0.3; }
      else if (S.cpiMode === 'zero') { S.cpiPos = 0; S.cpiNeg = 0; }
      renderAll(); return;
    }
    if (['terrain', 'useTopo', 'edge.type', 'fw.mode'].includes(t.dataset.path)) { renderAll(); return; }
    renderResults();
  });
  side.addEventListener('click', e => {
    const b = e.target.closest('button[data-set]'); if (!b) return;
    setPath(b.dataset.set, b.dataset.val);
    renderAll();
  });

  document.getElementById('openFile').addEventListener('change', e => {
    openProject(e.target.files && e.target.files[0]);
    e.target.value = '';
  });

  document.getElementById('out').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]'); if (!b) return;
    S.view = b.dataset.view;
    renderResults();
  });

  renderAll();
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
